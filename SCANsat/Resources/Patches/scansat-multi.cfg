@PART[scansat-multi-abi-1]
{
  MODULE
  {
    name = ModuleTechnicolor
    
    COLORZONE
    {
      name = main
      swatchPrimary = metalBasic
      swatchSecondary = blank
      transform = ABIBase
      transform = ABIMetal
      transform = ABILensCap
    }

    COLORZONE
    {
      name = mli
      swatchPrimary = mliGold
      swatchSecondary = blank
      transform = ABIFoil
    }
  }
}

