@PART[scansat-multi-abi-1|scansat-multi-modis-1|scansat-multi-msi-1]
{
  @MODULE[ModulePartVariants],*
  {
    @VARIANT[Gold]
    {
      %displayName = Foil
    }
    !VARIANT[Silver] {}
  }

  SHABBY_MATERIAL_REPLACE
  {
    materialDef = scansat-pbr-multi-1
    targetMaterial = scansat-multi-1
  }

  SHABBY_MATERIAL_REPLACE
  {
    materialDef = scansat-pbr-multi-2
    targetMaterial = scansat-multi-metal-1
  }

  SHABBY_MATERIAL_REPLACE
  {
    materialDef = scansat-pbr-multi-foil
    targetMaterial = scansat-multi-foil-1-alt
  }
}

SHABBY_MATERIAL_DEF
{
  name = scansat-pbr-multi-1
  shader = Resurfaced/Standard (TC)

  TEXTURE
  {
    _MainTex = SCANsatPBR/Assets/scansat-multi/scansat-pbr-multi-1-a
    _MetalMap = SCANsatPBR/Assets/scansat-multi/scansat-pbr-multi-1-m
    _TeamColorMap = SCANsatPBR/Assets/scansat-multi/scansat-pbr-multi-1-tc

    _BumpMap = SCANsat/Parts/scansat-multi/scansat-multi-1-n
  }
  // metalBasic, metalBasic 
  COLOR
  {
    _TC1Color = #808080
    _TC2Color = #808080
  }
  FLOAT {
    _TC1Metalness = 1
    _TC1Smoothness = 0.9
    _TC1MetalBlend = 0
    _TC1SmoothBlend = 0

    _TC2Metalness = 1
    _TC2Smoothness = 0.9
    _TC2MetalBlend = 0
    _TC2SmoothBlend = 0
  }
}

