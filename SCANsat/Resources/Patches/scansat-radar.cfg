@PART[scansat-radar-poseidon-3b-1]
{
  MODULE
  {
    name = ModuleTechnicolor
    
    COLORZONE
    {
      name = main
      swatchPrimary = metalBasic
      swatchSecondary = porkjetWhite
      transform = PoseidonBase
    }
    
    COLORZONE
    {
      name = mli
      swatchPrimary = mliGold
      swatchSecondary = blank
      transform = Poseidon_Foil
    }
  }

  SHABBY_MATERIAL_REPLACE
  {
    materialDef = scansat-pbr-radar-1
    targetMaterial = scansat-radar-1
  }

  SHABBY_MATERIAL_REPLACE
  {
    materialDef = scansat-pbr-radar-foil-1
    targetMaterial = scansat-radar-foil-1
  }
}

