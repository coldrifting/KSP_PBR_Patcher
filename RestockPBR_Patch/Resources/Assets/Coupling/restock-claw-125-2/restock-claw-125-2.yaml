texture:
  size: [256, 256]

  color_primary:
  - fill:
      image: ReStock/Assets/Coupling/restock-claw-125-2.dds
      channels: rgb
      mask: color_primary

  - invert:
      mask: color_primary

  - curves:
      points: [ [0, 64], [160, 255] ]
      mask: color_primary


  color_secondary:
  - fill:
      color: black

  diffuse:
  - fill:
      image: ReStock/Assets/Coupling/restock-claw-125-2.dds
      channels: rgb

  - saturation:
      percent: 0
      mask: sticker
      invert_masks: True

  - saturation:
      percent: 120
      mask: sticker

  - curves:
      points: [ [255, 180] ]
      mask: sticker
      invert_masks: True

  - fill:
      color: black
      mask: remove

  gloss:
  - fill:
      image: ReStock/Assets/Coupling/restock-claw-125-2.dds
      channels: a

  - curves:
      points: [ [32, 128], [110, 230] ]

  - fill:
      color: black
      mask: remove

  - fill:
      color: "#EEEEEE"
      mask: sticker

  gloss_alt:
  - copy:
       group: gloss

  - brightness:
      percent: 50
      mask: color_primary

  metal:
  - fill:
      color: white

  - fill:
      color: black
      masks: 
      - sticker
      - remove

  metal_alt:
  - fill:
      color: black
