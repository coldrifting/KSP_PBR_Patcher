@PART[restock-pbr-intake-mk2-ramp-1]:AFTER[ReStockPlusPBR]
{
  @MODEL,*:HAS[#model[ReStockPlusPBR/Assets/Aero/restock-pbr-intake-mk2-ramp-1]]
  {
    %model = ReStockPBR_Patch/Assets/Aero/restock-pbr-intake-mk2-ramp-1
  }

  MODULE
  {
    name = ModulePartVariants
    useMultipleDragCubes = false
    baseVariant = BlackAndWhite
    VARIANT
    {
      name = Base
      displayName = Bare
      primaryColor = #ffffff
      GAMEOBJECTS
      {
        Mk2IntakeRamp = true
        Mk2IntakeRampTiledA = false
        Mk2IntakeRampTiledATiles = false
        Mk2IntakeRampTiledB = false
        Mk2IntakeRampTiledBTiles = false
      }
    }
    VARIANT
    {
      name = TilesBottom
      displayName = Tiled (Lower)
      primaryColor = #ffffff
      secondaryColor = #000000
      GAMEOBJECTS
      {
        Mk2IntakeRamp = false
        Mk2IntakeRampTiledA = true
        Mk2IntakeRampTiledATiles = true
        Mk2IntakeRampTiledB = false
        Mk2IntakeRampTiledBTiles = false
      }
    }
    VARIANT
    {
