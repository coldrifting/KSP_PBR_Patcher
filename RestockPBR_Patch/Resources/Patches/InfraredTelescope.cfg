// Adjust inside to be pitch black while mirrors are still shiny
@PART[InfraredTelescope]:HAS[~RestockIgnore[*]]:AFTER[000_ReStock]
{
  MODEL
  {
    model = ReStockPBR_Patch/Assets/Science/restock-pbr-sentinel-1-inside
    position = 0.0, 0.0, 0.0
    scale = 1,1,1
    rotation = 0, 0, 0
  }

  @MODULE[ModulePartVariants]
  {
    @VARIANT[Shielded]
    {
      Telescope_Inside = true
    }
    @VARIANT[Bare]
    {
      Telescope_Inside = true
    }
  }
}