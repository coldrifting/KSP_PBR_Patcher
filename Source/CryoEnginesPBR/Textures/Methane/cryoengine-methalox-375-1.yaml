size: [1024, 1024]

color_primary:
  - fill:
      color: white
      masks:
        - color_primary

color_secondary:
  - fill:
      color: white
      masks:
        - color_secondary

diffuse:
  - fill:
      image: CryoEngines/Assets/MethaloxEngine/cryoengine-methalox-375-1.dds
      channels: rgb

  - curves:
      points:
        - [64, 85]

  - fill:
      color: black
      masks:
        - byebye

  - fill:
      image: CryoEngines/Assets/MethaloxEngine/cryoengine-methalox-375-1.dds
      channels: a
      masks:
        - color_primary

  - curves:
      points:
        - [13, 63]
        - [64, 150]
        - [255, 105]
      masks:
        - color_primary

gloss:
  - fill:
      image: CryoEngines/Assets/MethaloxEngine/cryoengine-methalox-375-1.dds
      channels: a

  - curves:
      points:
        - [64, 100]
      masks:
        - bg!
        - color_primary!

  - curves:
      points:
        - [18, 128]
        - [40, 192]
        - [95, 235]
      masks:
        - color_primary

  - curves:
      points:
        - [192, 192]
        - [220, 206]
        - [242, 192]
        - [255, 192]
      masks:
        - color_primary

gloss_alt:
  - copy:
      group: gloss

  - brightness:
      percent: 50
      masks:
        - color_primary
        - color_secondary

metal:
  - fill:
      color: white

metal_alt:
  - copy:
      group: metal

  - fill:
      color: black
      masks:
        - color_primary
        - color_secondary
