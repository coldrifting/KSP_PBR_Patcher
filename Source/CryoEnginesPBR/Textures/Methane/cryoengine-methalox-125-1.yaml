size: [1024, 1024]

color_primary:
  - fill:
      color: white
      masks:
        - color_primary

color_secondary:
  - fill:
      color: white
      masks:
        - color_secondary

diffuse:
  - fill:
      image: CryoEngines/Assets/MethaloxEngine/cryoengine-methalox-125-1.dds
      channels: rgb

  - saturation:
      percent: 0
      masks:
        - bg!
        - metal_paint!

  - saturation:
      percent: 120
      masks:
        - metal_paint

gloss:
  - fill:
      image: CryoEngines/Assets/MethaloxEngine/cryoengine-methalox-125-1.dds
      channels: a

  - fill:
      image: stripe_removal_gloss

  - curves:
      points:
        - [64, 115]

gloss_alt:
  - copy:
      group: gloss

  - brightness:
      percent: 50
      masks:
        - color_primary
        - color_secondary

metal:
  - fill:
      color: white

metal_alt:
  - copy:
      group: metal

  - fill:
      color: black
      masks:
        - color_primary
        - color_secondary
