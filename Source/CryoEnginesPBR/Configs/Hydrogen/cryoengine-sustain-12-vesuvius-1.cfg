// 1.25m Hydrolox Cryogenic Lifter Engine
@PART[cryoengine-vesuvius-1]:AFTER[CryoEngines]
{
  @MODEL,*:HAS[#model[CryoEngines/Assets/Engine/cryoengine-vesuvius-1]]
  {
    %model = CryoEnginesPBR/Assets/Engine/cryoengine-vesuvius-1
  }

  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = metalBasic
      swatchSecondary = hydrogenBlue
      transform = Vulcain_Deform
      transform = VulcainCompact
      transform = CylUpper002
      transform = CylUpper001
      transform = Vulcain_Engine
      transform = CylLower002
      transform = CylLower001
      transform = VulcainBoattail
      transform = VulcainRing125
    }

    COLORZONE
    {
      name = shrouds
      swatchPrimary = porkjetWhite
      swatchSecondary = hydrogenBlue
      transform = Shroud125BoattailMesh
      transform = Shroud125Mesh
      transform = ShroudCompactMesh
    }
  }
  
  @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitch]]
  {
    @SUBTYPE[Boattail]
    {
      %descriptionDetail = An aerodynamic shroud for engine protection. Includes autoshrouds.
      transform = Shroud125BoattailMesh
    }
  }
}
