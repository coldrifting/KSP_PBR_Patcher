// 1.25m Hydrolox Cryogenic Vacuum Engine
@PART[cryoengine-hecate-1]:AFTER[CryoEngines]
{
  @MODEL,*:HAS[#model[CryoEngines/Assets/Engine/cryoengine-hecate-1]]
  {
    %model = CryoEnginesPBR/Assets/Engine/cryoengine-hecate-1
  }

  %node_stack_top = 0.0, 0.405882, 0.0, 0.0, 1.0, 0.0, 1
  
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = metalBasic
      swatchSecondary = hydrogenBlue
      transform = HecateDeform
      transform = HecateCompact
      transform = HecateCylUpper002
      transform = HecateCylUpper001
      transform = HecateEngine
      transform = HecateCylLower002
      transform = HecateCylLower001
      transform = HecateExt
      transform = Hecate125Ring
    }

    COLORZONE
    {
      name = shrouds
      swatchPrimary = porkjetWhite
      swatchSecondary = hydrogenBlue
      transform = Shroud125Mesh
      transform = ShroudCompactMesh
    }
  }
}
