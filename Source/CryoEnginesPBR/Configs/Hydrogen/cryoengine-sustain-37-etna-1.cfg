// 3.75m Hydrolox Cryogenic Lifter Engine
@PART[cryoengine-etna-1]:AFTER[CryoEngines]
{
  @MODEL,*:HAS[#model[CryoEngines/Assets/Engine/cryoengine-etna-1]]
  {
    %model = CryoEnginesPBR/Assets/Engine/cryoengine-etna-1
  }
  
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = metalBasic
      swatchSecondary = hydrogenBlue
      transform = EtnaCompact
      transform = EtnaBoattail
      transform = Etna375
      transform = EtnaTurboGimbal
      transform = EtnaDeform
      transform = EtnaCommon
      transform = EtnaCylTurboLower
      transform = EtnaEngine
      transform = EntaCylLower002
      transform = EntaCylLower001
      transform = EntaCylUpper002
      transform = EntaCylUpper001
      transform = EntaCylTurboUpper
    }

    COLORZONE
    {
      name = shrouds
      swatchPrimary = porkjetWhite
      swatchSecondary = hydrogenBlue
      transform = Shroud375Mesh
      transform = ShroudCompactMesh
    }
  }
}
