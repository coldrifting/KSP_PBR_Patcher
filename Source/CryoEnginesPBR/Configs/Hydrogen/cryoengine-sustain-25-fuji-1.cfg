// 2.5m Hydrolox Cryogenic Lifter Engine
@PART[cryoengine-fuji-1]:AFTER[CryoEngines]
{
  @MODEL,*:HAS[#model[CryoEngines/Assets/Engine/cryoengine-fuji-1]]
  {
    %model = CryoEnginesPBR/Assets/Engine/cryoengine-fuji-1
  }

  @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitch]]
  {
    @SUBTYPE[Boattail]
    {
      %descriptionDetail = An aerodynamic shroud for engine protection. Includes autoshrouds.
      transform = Shroud25BoattailMesh
    }
  }
  
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = metalBasic
      swatchSecondary = hydrogenBlue
      transform = FujiCompact
      transform = FujiDeform
      transform = FujiEngine
      transform = FujiCylLower002
      transform = FujiCylLower001
      transform = FujiCylUpper002
      transform = FujiCylUpper001
      transform = FujiBoattail
      transform = Fuji25
    }

    COLORZONE
    {
      name = shrouds
      swatchPrimary = porkjetWhite
      swatchSecondary = hydrogenBlue
      transform = Shroud25BoattailMesh
      transform = Shroud25Mesh
      transform = ShroudCompactMesh
    }
  }
}
