// 3.75m Hydrolox Cryogenic Vacuum Engine
@PART[cryoengine-tharsis-1]:AFTER[CryoEngines]
{
  @MODEL,*:HAS[#model[CryoEngines/Assets/Engine/cryoengine-tharsis-1]]
  {
    %model = CryoEnginesPBR/Assets/Engine/cryoengine-tharsis-1
  }
  
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = metalBasic
      swatchSecondary = hydrogenBlue
      transform = TharsisDeformCompact
      transform = TharsisCompact
      transform = TharsisCylUpper004
      transform = TharsisCylUpper003
      transform = TharsisCylUpper002
      transform = TharsisCylUpper001
      transform = TharsisEngine01
      transform = TharsisNozzlExt01
      transform = TharsisCylLower002
      transform = TharsisCylLower001
      transform = TharsisEngine02
      transform = TharsisNozzleExt02
      transform = TharsisCylLower004
      transform = TharsisCylLower003
      transform = TharsisDeform
      transform = Tharsis375
    }

    COLORZONE
    {
      name = mli
      swatchPrimary = mliGold
      swatchSecondary = blank
      transform = TharsisFoil
    }

    COLORZONE
    {
      name = shrouds
      swatchPrimary = porkjetWhite
      swatchSecondary = hydrogenBlue
      transform = Shroud375Mesh
      transform = ShroudCompactMesh
    }
  }
}
