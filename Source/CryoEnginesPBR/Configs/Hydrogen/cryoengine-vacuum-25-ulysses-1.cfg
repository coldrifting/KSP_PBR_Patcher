// 2.5m Hydrolox Cryogenic Vacuum Engine
@PART[cryoengine-ulysses-1]:AFTER[CryoEngines]
{
  @MODEL,*:HAS[#model[CryoEngines/Assets/Engine/cryoengine-ulysses-1]]
  {
    %model = CryoEnginesPBR/Assets/Engine/cryoengine-ulysses-1
  }
  
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = metalBasic
      swatchSecondary = hydrogenBlue
      transform = J2XCompact
      transform = J2Deform
      transform = J2XEngine
      transform = CylJ2XLower002
      transform = CylJ2XLower001
      transform = CylJ2XUpper002
      transform = CylJ2XUpper001
      transform = J2X25
    }

    COLORZONE
    {
      name = shrouds
      swatchPrimary = porkjetWhite
      swatchSecondary = hydrogenBlue
      transform = Shroud25Mesh
      transform = ShroudCompactMesh
    }
  }
}
