// 1.875m Hydrolox Cryogenic Lifter Engine
@PART[cryoengine-erebus-1]:AFTER[CryoEngines]
{
  @MODEL,*:HAS[#model[CryoEngines/Assets/Engine/cryoengine-erebus-1]]
  {
    %model = CryoEnginesPBR/Assets/Engine/cryoengine-erebus-1
  }

  @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitch]]
  {
    @SUBTYPE[Boattail]
    {
      %descriptionDetail = An aerodynamic shroud for engine protection. Includes autoshrouds.
      transform = Shroud1875BoattailMesh
    }
  }
  
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = metalBasic
      swatchSecondary = hydrogenBlue
      transform = ErebusDeform
      transform = ErebusCompact
      transform = ErebusEngine
      transform = CylBottom002
      transform = CylBottom001
      transform = CylTop002
      transform = CylTop001
      transform = ErebusBoattail
      transform = Erebus1875Ring
    }

    COLORZONE
    {
      name = shrouds
      swatchPrimary = porkjetWhite
      swatchSecondary = hydrogenBlue
      transform = Shroud1875BoattailMesh
      transform = Shroud1875Mesh
      transform = ShroudCompactMesh
    }
  }
}
