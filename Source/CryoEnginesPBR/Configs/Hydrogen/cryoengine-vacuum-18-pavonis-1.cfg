// 1.875m Hydrolox Cryogenic Vacuum Engine
@PART[cryoengine-pavonis-1]:AFTER[CryoEngines]
{
  @MODEL,*:HAS[#model[CryoEngines/Assets/Engine/cryoengine-pavonis-1]]
  {
    %model = CryoEnginesPBR/Assets/Engine/cryoengine-pavonis-1
  }
  
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = metalBasic
      swatchSecondary = hydrogenBlue
      transform = PavonisCompact
      transform = PavonisDeform
      transform = PavonisEngine
      transform = PavonisNozzleExtension
      transform = PavonisCylLower002
      transform = PavonisCylLower001
      transform = PavonisCylUpper002
      transform = PavonisCylUpper001
      transform = Pavonis1875Ring
    }

    COLORZONE
    {
      name = shrouds
      swatchPrimary = porkjetWhite
      swatchSecondary = hydrogenBlue
      transform = Shroud1875Mesh
      transform = ShroudCompactMesh
    }
  }
}
