// 0.625m Hydrolox Cryogenic Sustainer Engine
@PART[cryoengine-stromboli-1]:AFTER[CryoEngines]
{
  @MODEL,*:HAS[#model[CryoEngines/Assets/Engine/cryoengine-stromboli-1]]
  {
    %model = CryoEnginesPBR/Assets/Engine/cryoengine-stromboli-1
  }

  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = metalBasic
      swatchSecondary = hydrogenBlue
      transform = StromboliDeform
      transform = StromboliCompact
      transform = StromboliCylUpper001
      transform = StromboliCylUpper002
      transform = StromboliEngine
      transform = StromboliCylLower002
      transform = StromboliCylLower001
      transform = StromboliBoattail
      transform = Stromboli0625
    }

    COLORZONE
    {
      name = shrouds
      swatchPrimary = porkjetWhite
      swatchSecondary = hydrogenBlue
      transform = Shroud0625BoattailMesh
      transform = ShroudCompactMesh
      transform = Shroud0625Mesh
    }
  }
  
  @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitch]]
  {
    @SUBTYPE[Boattail]
    {
      %descriptionDetail = An aerodynamic shroud for engine protection. Includes autoshrouds.
      transform = Shroud0625BoattailMesh
    }
  }
}
