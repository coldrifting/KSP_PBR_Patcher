// 2.5m lower stage engine (LE-9)
@PART[cryoengine-fuji-1]:AFTER[CryoEngines]
{
  @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitch]]
  {
    @SUBTYPE[Boattail]
    {
      %descriptionDetail = An aerodynamic shroud for engine protection. Includes autoshrouds.
      transform = Shroud25BoattailMesh
    }
  }
}
