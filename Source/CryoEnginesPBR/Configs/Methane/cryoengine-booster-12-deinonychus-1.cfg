// 1.25m Methalox Cryogenic Booster Engine
@PART[cryoengine-deinonychus-1]:AFTER[CryoEngines]
{
  @MODEL,*:HAS[#model[CryoEngines/Assets/MethaloxEngine/cryoengine-deinonychus-1]]
  {
    %model = CryoEnginesPBR/Assets/MethaloxEngine/cryoengine-deinonychus-1
  }

  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = metalBasic
      swatchSecondary = methaneGreen
      transform = RaptorTopCompact
      transform = RaptorTopCommon
      transform = RaptorDeform
      transform = RaptorPowerhead
      transform = RaptorNozzle
      transform = RaptorCylBot2
      transform = RaptorCylBot1
      transform = RaptorCylTop2
      transform = RaptorCylTop1
      transform = RaptorBoattail
      transform = RaptorTop125
    }

    COLORZONE
    {
      name = shrouds
      swatchPrimary = metalBasic
      swatchSecondary = methaneGreen
      transform = Shroud_125_RaptorBoattail
      transform = Shroud_125_Raptor
    }
  }
  
  @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitch]]
  {
    @SUBTYPE[Boattail]
    {
      %descriptionDetail = An aerodynamic shroud for engine protection. Includes autoshrouds.
      transform = Shroud_125_RaptorBoattail
    }
  }
}
