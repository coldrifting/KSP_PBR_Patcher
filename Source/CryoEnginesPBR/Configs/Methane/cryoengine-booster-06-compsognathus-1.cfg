// 0.625m Methalox Cryogenic Booster Engine
@PART[cryoengine-compsognathus-1]:AFTER[CryoEngines]
{
  @MODEL,*:HAS[#model[CryoEngines/Assets/MethaloxEngine/cryoengine-compsognathus-1]]
  {
    %model = CryoEnginesPBR/Assets/MethaloxEngine/cryoengine-compsognathus-1
  }

  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = metalBasic
      swatchSecondary = methaneGreen
      transform = PrometheusCompact
      transform = PrometheusDeform
      transform = PrometheusCommon
      transform = ProPistonTop2
      transform = ProPistonTop1
      transform = PrometheusEngine
      transform = ProPistonBot2
      transform = ProPistonBot1
      transform = PromethusBoat
      transform = ProBoatDeform
      transform = ProBoat
      transform = Promethus0625
    }

    COLORZONE
    {
      name = shrouds
      swatchPrimary = metalBasic
      swatchSecondary = methaneGreen
      transform = Shroud_0625_PrometheusBoattail
      transform = Shroud_0625_PrometheusCompact
      transform = Shroud_0625_Prometheus
    }
  }

  @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitch]]
  {
    @SUBTYPE[Boattail]
    {
      %descriptionDetail = An aerodynamic shroud for engine protection. Includes autoshrouds.
      transform = Shroud_0625_PrometheusBoattail
    }
  }
}
