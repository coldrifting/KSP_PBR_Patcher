// 0.625m Methalox Cryogenic Vacuum Engine
@PART[cryoengine-hawk-1]:AFTER[CryoEngines]
{
  @MODEL,*:HAS[#model[CryoEngines/Assets/MethaloxEngine/cryoengine-hawk-1]]
  {
    %model = CryoEnginesPBR/Assets/MethaloxEngine/cryoengine-hawk-1
  }

  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = metalBasic
      swatchSecondary = methaneGreen
      transform = RS18Compact
      transform = RS18Deform
      transform = RS18Common
      transform = RS18CylUpper3
      transform = RS18CylUpper2
      transform = RS18CylUpper1
      transform = RS18Engine
      transform = RS18CylLower3
      transform = RS18CylLower2
      transform = RS18CylLower1
      transform = RS180625
    }

    COLORZONE
    {
      name = shrouds
      swatchPrimary = metalBasic
      swatchSecondary = methaneGreen
      transform = Shroud_0625_RS18
    }
  }
}
