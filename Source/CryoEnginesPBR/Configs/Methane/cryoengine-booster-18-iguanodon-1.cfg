// 1.875m Methalox Cryogenic Booster Engine
@PART[cryoengine-iguanodon-1]:AFTER[CryoEngines]
{
  @MODEL,*:HAS[#model[CryoEngines/Assets/MethaloxEngine/cryoengine-iguanodon-1]]
  {
    %model = CryoEnginesPBR/Assets/MethaloxEngine/cryoengine-iguanodon-1
  }

  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = metalBasic
      swatchSecondary = methaneGreen
      transform = BE4Compact
      transform = BE4Deform
      transform = BE4Engine
      transform = BE4CylLow2
      transform = BE4CylLow01
      transform = BE4CylUp2
      transform = BE4CylUp1
      transform = BE4Top1875 (1)
      transform = BE4BoatDeform
      transform = BE4Boat
      transform = BE4Top1875
    }

    COLORZONE
    {
      name = shrouds
      swatchPrimary = metalBasic
      swatchSecondary = methaneGreen
      transform = Shroud_1875_BE4Compact
      transform = Shroud_1875_BE4
    }
  }
}
