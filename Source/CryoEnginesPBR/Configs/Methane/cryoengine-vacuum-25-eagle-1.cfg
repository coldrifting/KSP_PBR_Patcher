// 2.5m Methalox Cryogenic Vacuum Engine
@PART[cryoengine-eagle-1]:AFTER[CryoEngines]
{
  @MODEL,*:HAS[#model[CryoEngines/Assets/MethaloxEngine/cryoengine-eagle-1]]
  {
    %model = CryoEnginesPBR/Assets/MethaloxEngine/cryoengine-eagle-1
  }
  
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = metalBasic
      swatchSecondary = methaneGreen
      transform = RaptorVacTopCompact
      transform = RaptorVacTop25
      transform = RaptorVacTopCommon
      transform = RaptorVacDeform
      transform = RaptorVacPowerhead
      transform = RaptorVacNozzle
      transform = RaptorVacCylBot002
      transform = RaptorVacCylBot001
      transform = RaptorVacCylTop002
      transform = RaptorVacCylTop001
    }

    COLORZONE
    {
      name = shrouds
      swatchPrimary = metalBasic
      swatchSecondary = methaneGreen
      transform = RaptorVacShroud
    }
  }
}
