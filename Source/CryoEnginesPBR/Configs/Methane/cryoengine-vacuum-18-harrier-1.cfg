// 1.875m Methalox Cryogenic Vacuum Engine
@PART[cryoengine-harrier-1]:AFTER[CryoEngines]
{
  @MODEL,*:HAS[#model[CryoEngines/Assets/MethaloxEngine/cryoengine-harrier-1]]
  {
    %model = CryoEnginesPBR/Assets/MethaloxEngine/cryoengine-harrier-1
  }

  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = metalBasic
      swatchSecondary = methaneGreen
      transform = TQ11Compact
      transform = TQ11Main
      transform = TQ11Deform
      transform = TQ11Vernier004
      transform = TQ11Vernier003
      transform = TQ11Vernier002
      transform = TQ11Vernier1
      transform = TQ11_1875
    }

    COLORZONE
    {
      name = shrouds
      swatchPrimary = metalBasic
      swatchSecondary = methaneGreen
      transform = Shroud_1875_TQ11Compact
      transform = Shroud_1875_TQ11
    }
  }
}
