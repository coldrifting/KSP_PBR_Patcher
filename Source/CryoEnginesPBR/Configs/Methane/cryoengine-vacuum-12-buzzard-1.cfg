  {
    %model = CryoEnginesPBR/Assets/MethaloxEngine/cryoengine-buzzard-1
  }

  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = metalBasic
      swatchSecondary = methaneGreen
      transform = M10TopCompact
      transform = M10Deform
      transform = M10Common
      transform = M10CylTop2
      transform = M10CylTop1
      transform = M10Engine
      transform = M10CtlBot2
      transform = M10CylBot1
      transform = M10Top125Boat
      transform = M10Top125
    }

    COLORZONE
    {
      name = shrouds
      swatchPrimary = metalBasic
      swatchSecondary = methaneGreen
      transform = Shroud_125_M10COmpact
      transform = Shroud_125_M10Boat
      transform = Shroud_125_M10
    }
  }
}
