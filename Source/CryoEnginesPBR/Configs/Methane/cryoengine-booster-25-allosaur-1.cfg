// 2.5m Methalox Cryogenic Booster Engine
@PART[cryoengine-allosaur-1]:AFTER[CryoEngines]
{
  @MODEL,*:HAS[#model[CryoEngines/Assets/MethaloxEngine/cryoengine-allosaur-1]]
  {
    %model = CryoEnginesPBR/Assets/MethaloxEngine/cryoengine-allosaur-1
  }

  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = metalBasic
      swatchSecondary = methaneGreen
      transform = STBE_Compact
      transform = STBEDEform
      transform = STBEUpperCyl002
      transform = STBEUpperCyl001
      transform = STBEEngine
      transform = STBELowerCyl002
      transform = STBELowerCyl001
      transform = STBEBoat
      transform = STBE25
    }

    COLORZONE
    {
      name = shrouds
      swatchPrimary = metalBasic
      swatchSecondary = methaneGreen
      transform = STBEShroudCompact
      transform = STBEShroud
    }
  }
}
