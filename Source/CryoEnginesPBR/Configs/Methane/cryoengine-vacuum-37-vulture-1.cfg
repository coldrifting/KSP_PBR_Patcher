// 3.75m Methalox Cryogenic Vacuum Engine
@PART[cryoengine-vulture-1]:AFTER[CryoEngines]
{
  @MODEL,*:HAS[#model[CryoEngines/Assets/MethaloxEngine/cryoengine-vulture-1]]
  {
    %model = CryoEnginesPBR/Assets/MethaloxEngine/cryoengine-vulture-1
  }

  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = metalBasic
      swatchSecondary = methaneGreen
      transform = BE4UCompact
      transform = BE4UDeform
      transform = BE4UEngine
      transform = BE4UCore
      transform = BE4UExtension
      transform = BE4CylLow002
      transform = BE4CylLow001
      transform = BE4CylUp002
      transform = BE4CylUp001
      transform = BE4UUpper
    }

    COLORZONE
    {
      name = shrouds
      swatchPrimary = metalBasic
      swatchSecondary = methaneGreen
      transform = Shroud375Compact
      transform = Shroud375
    }
  }
}
