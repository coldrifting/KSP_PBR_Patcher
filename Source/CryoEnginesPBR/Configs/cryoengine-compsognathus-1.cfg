// 0.625m booster engine (Prometheus)
@PART[cryoengine-compsognathus-1]:AFTER[CryoEngines]
{
  @MODULE[ModuleB9PartSwitch]:HAS[#moduleID[meshSwitch]]
  {
    @SUBTYPE[Boattail]
    {
      %descriptionDetail = An aerodynamic shroud for engine protection. Includes autoshrouds.
      transform = Shroud_0625_PrometheusBoattail
    }
  }
}
