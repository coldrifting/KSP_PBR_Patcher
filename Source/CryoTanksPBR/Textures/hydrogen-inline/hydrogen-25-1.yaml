size: [1024, 1024]

color_primary:
  - fill:
      color: white
      masks:
        - bg!
        - iso_lines!
        - color_secondary_1!
        - color_secondary_2!
        - color_secondary_3!

color_secondary:
  - fill:
      color: white
      masks:
        - color_secondary_1
        - color_secondary_2
        - color_secondary_3

diffuse:
  - fill:
      image: CryoTanks/Parts/HydrogenTanks/hydrogen-inline/hydrogen-25-1.dds
      channels: rgb

  - saturation:
      percent: 0

  - curves:
      points:
        - [255, 150]
      masks:
        - bg!
        - color_secondary_1!
        - color_secondary_2!
        - color_secondary_3!

  - curves:
      points:
        - [64, 85]
      masks:
        - iso_lines

  - curves:
      points:
        - [255, 200]
      masks:
        - color_secondary_2

  - curves:
      points:
        - [64, 120]
      masks:
        - color_secondary_3

gloss:
  - fill:
      image: CryoTanks/Parts/HydrogenTanks/hydrogen-inline/hydrogen-25-1.dds
      channels: a

  - curves:
      points:
        - [255, 220]
      masks:
        - bg!
        - color_secondary_1!
        - color_secondary_2!
        - color_secondary_3!

  - curves:
      points:
        - [64, 95]
      masks:
        - iso_lines

  - curves:
      points:
        - [64, 100]
        - [255, 210]
      masks:
        - color_secondary_1
        - color_secondary_2
        - color_secondary_3

gloss_alt:
  - copy:
      group: gloss

  - brightness:
      percent: 50
      masks:
        - bg!
        - iso_lines!

metal:
  - fill:
      color: white

metal_alt:
  - fill:
      color: white
      masks:
        - iso_lines
