size: [1024, 1024]

color_primary:
  - fill:
      color: white
      masks:
        - iso
        - iso_lines!
        - foil
        - foil_lines!

color_secondary:
  - fill:
      color: white
      masks:
        - metal

diffuse:
  - fill:
      image: CryoTanks/Parts/HydrogenTanks/hydrogen-inline/hydrogen-125.dds
      channels: rgb

  - saturation:
      percent: 0

  - curves:
      points:
        - [255, 150]
      masks:
        - iso

  - curves:
      points:
        - [128, 100]
      masks:
        - metal

gloss:
  - fill:
      image: CryoTanks/Parts/HydrogenTanks/hydrogen-inline/hydrogen-125-s.dds
      channels: rgb

  - saturation:
      percent: 0

  - curves:
      points:
        - [64, 128]
      masks:
        - metal

  - curves:
      points:
        - [220, 192]
        - [255, 210]
      masks:
        - iso

  - curves:
      points:
        - [64, 115]
      masks:
        - foil

  - fill:
      color: "#C8C8C8"
      masks:
        - foil_lines

gloss_alt:
  - copy:
      group: gloss

  - brightness:
      percent: 50
      masks:
        - iso
        - iso_lines!
        - foil
        - foil_lines!
        - metal

metal:
  - fill:
      color: white

metal_alt:
  - fill:
      color: white
      masks:
        - foil_lines
