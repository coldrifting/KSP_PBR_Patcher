size: [1024, 1024]

color_primary:
  - fill:
      color: white
      masks:
        - bg!
        - foil_lines!

color_secondary:
  - fill:
      color: black

diffuse:
  - fill:
      image: CryoTanks/Parts/HydrogenTanks/hydrogen-inline/hydrogen-25-2.dds
      channels: rgb

  - saturation:
      percent: 0

  - curves:
      points:
        - [64, 100]

  - fill:
      image: foil_lines_shadow

  - fill:
      color: "#888888"
      masks:
        - foil_lines

gloss:
  - fill:
      image: CryoTanks/Parts/HydrogenTanks/hydrogen-inline/hydrogen-25-2-s.dds
      channels: rgb

  - saturation:
      percent: 0

  - curves:
      points:
        - [64, 115]

  - fill:
      color: "#C8C8C8"
      masks:
        - foil_lines

gloss_alt:
  - copy:
      group: gloss

  - brightness:
      percent: 50
      masks:
        - bg!
        - foil_lines!

metal:
  - fill:
      color: white

metal_alt:
  - fill:
      color: white
      masks:
        - foil_lines
