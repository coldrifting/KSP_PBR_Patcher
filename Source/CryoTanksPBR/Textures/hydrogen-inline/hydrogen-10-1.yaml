size: [2048, 2048]

color_primary:
  - fill:
      color: white
      masks:
        - bg!
        - foil_lines!

color_secondary:
  - fill:
      color: black

diffuse:
  - fill:
      image: CryoTanks/Parts/HydrogenTanks/hydrogen-inline/hydrogen-10-1.dds
      channels: rgb

  - saturation:
      percent: 0

  - curves:
      points:
        - [64, 100]

  - fill:
      color: "#888888"
      masks:
        - foil_lines

gloss:
  - fill:
      image: CryoTanks/Parts/HydrogenTanks/hydrogen-inline/hydrogen-10-1-s.dds
      channels: rgb

  - saturation:
      percent: 0

  - curves:
      points:
        - [64, 115]

  - fill:
      color: "#C8C8C8"
      masks:
        - foil_lines

gloss_alt:
  - copy:
      group: gloss

  - brightness:
      percent: 50
      masks:
        - bg!
        - foil_lines!

metal:
  - fill:
      color: white

metal_alt:
  - fill:
      color: white
      masks:
        - foil_lines
