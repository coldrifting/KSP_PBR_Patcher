size: [ 2048, 2048 ]

color_primary:
  - fill:
      image: ReStock/Assets/Resource/restock-isru-1.dds
      channels: a

  - saturation:
      percent: 0

  - curves:
      points:
        - [ 16, 128 ]
        - [ 35, 192 ]
        - [ 75, 225 ]
      masks:
        - metal_darkest

  - curves:
      points:
        - [ 16, 64 ]
        - [ 100, 200 ]
      masks:
        - metal_dark

  - curves:
      points:
        - [ 64, 100 ]
      masks:
        - metal_light

  - curves:
      points:
        - [ 64, 115 ]
      masks:
        - metal_1

  - curves:
      points:
        - [ 64, 165 ]
        - [ 128, 225 ]
      masks:
        - metal_2

  - curves:
      points:
        - [ 64, 100 ]
      masks:
        - metal_3

  - fill:
      color: "#EEEEEE"
      masks:
        - metal!

  - curves:
      points:
        - [ 90, 0 ]
        - [ 150, 255 ]

  - fill:
      color: black
      masks:
        - bg!
        - color_primary!
        - color_primary_seams#888888

color_secondary:
  - fill:
      image: ReStock/Assets/Resource/restock-isru-1.dds
      channels: a

  - saturation:
      percent: 0

  - curves:
      points:
        - [ 16, 128 ]
        - [ 35, 192 ]
        - [ 75, 225 ]
      masks:
        - metal_darkest

  - curves:
      points:
        - [ 16, 64 ]
        - [ 100, 200 ]
      masks:
        - metal_dark

  - curves:
      points:
        - [ 64, 100 ]
      masks:
        - metal_light

  - curves:
      points:
        - [ 64, 115 ]
      masks:
        - metal_1

  - curves:
      points:
        - [ 64, 165 ]
        - [ 128, 225 ]
      masks:
        - metal_2

  - curves:
      points:
        - [ 64, 100 ]
      masks:
        - metal_3

  - fill:
      color: "#EEEEEE"
      masks:
        - metal!

  - curves:
      points:
        - [ 128, 0 ]
        - [ 192, 255 ]

  - fill:
      color: black
      masks:
        - bg!
        - color_secondary!

diffuse:
  - fill:
      image: ReStock/Assets/Resource/restock-isru-1.dds
      channels: rgb

  - saturation:
      percent: 0
      masks:
        - metal

  - saturation:
      percent: 120
      masks:
        - metal!

  - curves:
      points:
        - [ 64, 100 ]

  - curves:
      points:
        - [ 64, 100 ]
      masks:
        - metal_4

gloss:
  - fill:
      image: ReStock/Assets/Resource/restock-isru-1.dds
      channels: a

  - saturation:
      percent: 0

  - curves:
      points:
        - [ 16, 128 ]
        - [ 35, 192 ]
        - [ 75, 225 ]
      masks:
        - metal_darkest

  - curves:
      points:
        - [ 16, 64 ]
        - [ 100, 200 ]
      masks:
        - metal_dark

  - curves:
      points:
        - [ 64, 100 ]
      masks:
        - metal_light

  - curves:
      points:
        - [ 64, 115 ]
      masks:
        - metal_1

  - curves:
      points:
        - [ 64, 165 ]
        - [ 128, 225 ]
      masks:
        - metal_2

  - curves:
      points:
        - [ 64, 100 ]
      masks:
        - metal_3

  - fill:
      color: "#EEEEEE"
      masks:
        - bg!
        - metal!

gloss_alt:
  - copy:
      group: gloss

  - brightness:
      percent: 50
      masks:
        - color_primary
        - color_primary_seams#888888
        - color_secondary

metal:
  - fill:
      color: white
      masks:
        - metal

metal_alt:
  - copy:
      group: metal

  - fill:
      color: black
      masks:
        - color_primary
        - color_primary_seams#888888
        - color_secondary
