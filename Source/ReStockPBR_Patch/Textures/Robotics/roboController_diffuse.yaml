size: [ 256, 256 ]

color_primary:
  - fill:
      color: white
      masks:
        - color_primary

color_secondary:
  - fill:
      color: black

diffuse:
  - fill:
      image: SquadExpansion/Serenity/Parts/Robotics/Controllers/roboController_diffuse.dds
      channels: rgb

  - saturation:
      percent: 120
      masks:
        - light

  - saturation:
      percent: 0
      masks:
        - bg!
        - light!

  - curves:
      points:
        - [ 128, 115 ]

gloss:
  - fill:
      image: SquadExpansion/Serenity/Parts/Robotics/Controllers/roboController_diffuse.dds
      channels: rgb

  - saturation:
      percent: 0

  - curves:
      points:
        - [ 64, 107 ]

gloss_alt:
  - copy:
      group: gloss

  - brightness:
      percent: 50
      masks:
        - color_primary

metal:
  - fill:
      color: white

  - fill:
      color: black
      masks:
        - light
        - screen

metal_alt:
  - copy:
      group: metal

  - fill:
      color: black
      masks:
        - color_primary
