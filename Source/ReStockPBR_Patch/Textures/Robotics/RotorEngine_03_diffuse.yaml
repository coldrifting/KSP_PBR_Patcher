size: [ 1024, 1024 ]

color_primary:
  - fill:
      image: SquadExpansion/Serenity/Parts/Robotics/Assets/RotorEngine_03_diffuse.dds
      channels: rgb

  - curves:
      points:
        - [ 0, 64 ]
        - [ 155, 255 ]

  - fill:
      color: black
      masks:
        - bg!
        - color_primary!

color_secondary:
  - fill:
      image: SquadExpansion/Serenity/Parts/Robotics/Assets/RotorEngine_03_diffuse.dds
      channels: rgb

  - curves:
      points:
        - [ 64, 142 ]
        - [ 240, 0 ]
      masks:
        - metal_top

  - curves:
      points:
        - [ 0, 64 ]
        - [ 128, 255 ]

  - fill:
      color: black
      masks:
        - bg!
        - color_secondary!

diffuse:
  - fill:
      image: SquadExpansion/Serenity/Parts/Robotics/Assets/RotorEngine_03_diffuse.dds
      channels: rgb

  - saturation:
      percent: 0

  - curves:
      points:
        - [ 255, 200 ]

  - curves:
      points:
        - [ 64, 80 ]
      masks:
        - color_secondary

  - curves:
      points:
        - [ 64, 135 ]
        - [ 192, 192 ]
      masks:
        - metal_top

gloss:
  - copy:
      group: diffuse

  - curves:
      points:
        - [ 64, 120 ]

gloss_alt:
  - copy:
      group: gloss

  - brightness:
      percent: 50
      masks:
        - color_primary
        - color_secondary

metal:
  - fill:
      color: white

metal_alt:
  - copy:
      group: metal

  - fill:
      color: black
      masks:
        - color_primary
        - color_secondary
