size: [ 1024, 1024 ]

dlc: BreakingGround

color_primary:
  - fill:
      color: white
      masks:
        - color_primary

color_secondary:
  - fill:
      color: white
      masks:
        - color_secondary

diffuse:
  - fill:
      image: SquadExpansion/Serenity/Parts/Robotics/Assets/rotoServos_diffuse_plain.dds
      channels: rgb

  - saturation:
      percent: 0

  - curves:
      points:
        - [ 50, 128 ]
        - [ 100, 192 ]
      masks:
        - bg!
        - color_primary!

  - curves:
      points:
        - [ 64, 72 ]
      masks:
        - color_primary

gloss:
  - copy:
      group: diffuse

  - curves:
      points:
        - [ 60, 128 ]
        - [ 128, 192 ]

gloss_alt:
  - copy:
      group: gloss

  - brightness:
      percent: 50
      masks:
        - color_primary

metal:
  - fill:
      color: white

metal_alt:
  - copy:
      group: metal

  - fill:
      color: black
      masks:
        - color_primary
