@PART[InfraredTelescope]:AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[ReStock/Assets/Science/restock-sentinel-1]]
  {
    %model = ReStockPBR_Patch/Assets/Science/restock-sentinel-1
  }

  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetBlack
      swatchSecondary = metalBasic
      transform = Telescope_Shielded
      transform = Telescope_Bare
    }
  }
}
