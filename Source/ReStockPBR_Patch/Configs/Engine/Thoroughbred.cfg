@PART[Thoroughbred]:HAS[~RestockIgnore[*]]:AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[ReStockPBR/Assets/Engine/restock-pbr-engine-srb-thoroughbred-1]]
  {
    %model = ReStockPBR_Patch/Assets/Engine/restock-pbr-engine-srb-thoroughbred-1
  }

  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = TBNozzle
      transform = EngineCore
      transform = 25CylBot002
      transform = 25CylBot001
      transform = TBBase
      transform = 25CylTop002
      transform = 25CylTop001
    }
  }
}
