@PART[RAPIER]:HAS[~RestockIgnore[*]]:AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[ReStockPBR/Assets/Engine/restock-pbr-engine-rapier-1]]
  {
    %model = ReStockPBR_Patch/Assets/Engine/restock-pbr-engine-rapier-1
  }

  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = RAPIERTiled
      transform = RAPIER
    }

    COLORZONE
    {
      name = tiles
      swatchPrimary = tileBlack
      swatchSecondary = blank
      transform = RAPIERTiledLower
    }
  }
}
