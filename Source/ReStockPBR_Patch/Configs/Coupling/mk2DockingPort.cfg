@PART[mk2DockingPort]:AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[ReStockPBR/Assets/Coupling/restock-pbr-docking-inline-mk2-1]]
  {
    %model = ReStockPBR_Patch/Assets/Coupling/restock-pbr-docking-inline-mk2-1
  }

  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = BaseTiled
      transform = Door2
      transform = Door1
      transform = Base
    }

    COLORZONE
    {
      name = tiles
      swatchPrimary = tileBlack
      swatchSecondary = blank
      transform = BaseTiledLower
    }
  }
}
