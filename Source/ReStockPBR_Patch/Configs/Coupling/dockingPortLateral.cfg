@PART[dockingPortLateral]:AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[ReStockPBR/Assets/Coupling/restock-pbr-docking-inline-125-1]]
  {
    %model = ReStockPBR_Patch/Assets/Coupling/restock-pbr-docking-inline-125-1
  }

  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = Mk1_inlinePort_HousingTiles
      transform = Mk1_inlinePort_Housing
      transform = Mk1_inlinePort_Door_R
      transform = Mk1_inlinePort_Door_L
    }

    COLORZONE
    {
      name = tiles
      swatchPrimary = tileBlack
      swatchSecondary = blank
      transform = Mk1_inlinePort_HousingTilesLower
    }
  }
}
