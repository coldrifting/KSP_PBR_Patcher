@PART[GrapplingDevice]:HAS[~RestockIgnore[*]]:AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[ReStock/Assets/Coupling/restock-claw-125-1]]
  {
    %model = ReStockPBR_Patch/Assets/Coupling/restock-claw-125-1
  }

  !MODULE[ModulePartVariants],* {}

  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = metalBasic
      swatchSecondary = electricalYellow
      transform = claw
      transform = Accents_white
    }
  }
}
