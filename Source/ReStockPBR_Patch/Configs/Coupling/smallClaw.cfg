@PART[smallClaw]:HAS[~RestockIgnore[*]]AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[ReStock/Assets/Coupling/restock-claw-625-2]]
  {
    %model = ReStockPBR_Patch/Assets/Coupling/restock-claw-625-2
  }

  !MODULE[ModulePartVariants],* {}

  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = electricalYellow
      swatchSecondary = metalBasic
      transform = Claw
      transform = Body_white
    }
  }
}
