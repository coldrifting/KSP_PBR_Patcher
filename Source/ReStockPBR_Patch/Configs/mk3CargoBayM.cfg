// Patch borrowed from scocdp's Technicolor Additions Fixes mod
// https://forum.kerbalspaceprogram.com/topic/231618-wip-technicoloradditions/
@PART[mk3CargoBayM]:AFTER[ReStockPBR]
{
    @MODULE[ModulePartVariants]:HAS[#baseVariant[BlackAndWhite]]
    {
        @baseVariant = Base

        @VARIANT[Base]
        {
            @GAMEOBJECTS
            {
                -Mk3BayMedTiles = DELETE
                %Mk3BayMedTiled = false
            }
        }

        @VARIANT[TilesTop]
        {
            @GAMEOBJECTS
            {
                @Mk3BayMed = true
            }
        }
    }
}
