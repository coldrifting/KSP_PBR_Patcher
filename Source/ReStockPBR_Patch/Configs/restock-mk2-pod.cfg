// Replace material of non-PBR component, adjust variant names to match new paint
@PART[restock-mk2-pod]:AFTER[zzReStockPlus]:NEEDS[SquadExpansion/MakingHistory]
{
  SHABBY_MATERIAL_REPLACE
  {
    materialDef = restock-pbr-patch-crewed-endcap-2
    targetMaterial = restock-crewed-endcap-2
  }

  @MODEL,*:HAS[#model[ReStock/Assets/Command/restock-hatch-common-round-grey-1]]
  {
    %model = ReStockPBR/Assets/Command/restock-pbr-hatch-common-round-1
  }

  @MODULE[ModuleTechnicolor]
  {
    COLORZONE
    {
      name = hatches
      swatchPrimary = metalBasic
      swatchSecondary = blank
      transform = CommonHatchRound
    }
  }

  @MODULE[ModulePartVariants]
  {
    @VARIANT[Dark]
    {
      %displayName = Corrugated
      %themeName = Classic
      %primaryColor = #ffffff
      %secondaryColor = #4c4f47
    }

    @VARIANT[White]
    {
      %displayName = Smooth
    }
  }
}
