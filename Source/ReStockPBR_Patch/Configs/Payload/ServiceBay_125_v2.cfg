@PART[ServiceBay_125_v2]:AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[ReStockPBR/Assets/Payload/restock-pbr-service-bay-125-1]]
  {
    %model = ReStockPBR_Patch/Assets/Payload/restock-pbr-service-bay-125-1
  }

  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = payloadGrey
      transform = ServiceBay125_Transparent
      transform = ServiceBay125_Opaque
      transform = ServiceBay125
      transform = Tube011
      transform = Tube010
      transform = Tube009
      transform = Door001
    }
  }
}
