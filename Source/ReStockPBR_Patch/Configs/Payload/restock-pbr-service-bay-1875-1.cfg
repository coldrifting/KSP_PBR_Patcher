@PART[restock-service-bay-1875-1]:AFTER[ReStockPlusPBR]
{
  @MODEL,*:HAS[#model[ReStockPlusPBR/Assets/Payload/restock-pbr-service-bay-1875-1]]
  {
    %model = ReStockPBR_Patch/Assets/Payload/restock-pbr-service-bay-1875-1
  }

  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = payloadGrey
      transform = ServiceBay1875Transparent
      transform = ServiceBay1875Opaque
      transform = ServiceBay1875Hollow
      transform = Door2
      transform = Door1
    }
  }
}
