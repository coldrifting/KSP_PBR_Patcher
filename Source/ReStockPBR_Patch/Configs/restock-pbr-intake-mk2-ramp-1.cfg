// Mk2 Ramp Intake - Adds two types of heat tile variants
@PART[restock-pbr-intake-mk2-ramp-1]:AFTER[ReStockPlusPBR]
{
  MODULE
  {
    name = ModulePartVariants
    useMultipleDragCubes = false
    baseVariant = BlackAndWhite

    VARIANT
    {
      name = Base
      displayName = Bare
      primaryColor = #ffffff

      GAMEOBJECTS
      {
        Mk2IntakeRamp = true
        Mk2IntakeRampTiledA = false
        Mk2IntakeRampTiledATiles = false
        Mk2IntakeRampTiledB = false
        Mk2IntakeRampTiledBTiles = false
      }
    }

    VARIANT
    {
      name = TilesBottom
      displayName = Tiled (Lower)
      primaryColor = #ffffff
      secondaryColor = #000000

      GAMEOBJECTS
      {
        Mk2IntakeRamp = false
        Mk2IntakeRampTiledA = true
        Mk2IntakeRampTiledATiles = true
        Mk2IntakeRampTiledB = false
        Mk2IntakeRampTiledBTiles = false
      }
    }

    VARIANT
    {
      name = TilesTop
      displayName = Tiled (Upper)
      primaryColor = #000000
      secondaryColor = #ffffff

      GAMEOBJECTS
      {
        Mk2IntakeRamp = false
        Mk2IntakeRampTiledA = false
        Mk2IntakeRampTiledATiles = false
        Mk2IntakeRampTiledB = true
        Mk2IntakeRampTiledBTiles = true
      }
    }
  }
}
