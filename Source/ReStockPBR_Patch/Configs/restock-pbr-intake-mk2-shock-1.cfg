// Mk2 Shock Intake - Add heat tile variant
@PART[restock-pbr-intake-mk2-shock-1]:AFTER[ReStockPlusPBR]
{
  MODULE
  {
    name = ModulePartVariants
    useMultipleDragCubes = false
    baseVariant = BlackAndWhite

    VARIANT
    {
      name = Base
      displayName = Bare
      primaryColor = #ffffff

      GAMEOBJECTS
      {
        Mk2IntakeShock = true
        Mk2IntakeShockTiles = false
        Mk2IntakeShockTilesLower = false
      }
    }

    VARIANT
    {
      name = Tiles
      displayName = Tiled
      primaryColor = #000000
      secondaryColor = #ffffff

      GAMEOBJECTS
      {
        Mk2IntakeShock = false
        Mk2IntakeShockTiles = true
        Mk2IntakeShockTilesLower = true
      }
    }
  }
}
