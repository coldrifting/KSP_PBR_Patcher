@PART[mk3FuselageMONO]:AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[ReStockPBR/Assets/FuelTank/restock-pbr-fueltank-mk3-mono-1]]
  {
    %model = ReStockPBR_Patch/Assets/FuelTank/restock-pbr-fueltank-mk3-mono-1
  }

  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = MonoTiled
      transform = Mono
    }

    COLORZONE
    {
      name = tiles
      swatchPrimary = tileBlack
      swatchSecondary = blank
      transform = MonoTiledLower
    }
  }
}
