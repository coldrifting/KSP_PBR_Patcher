@PART[Mk1FuselageStructural]:AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[ReStockPBR/Assets/FuelTank/restock-pbr-fuselage-mk1-hollow-1]]
  {
    %model = ReStockPBR_Patch/Assets/FuelTank/restock-pbr-fuselage-mk1-hollow-1
  }

  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = Mk1StructuralHollowTiles
      transform = Mk1StructuralHollow
    }

    COLORZONE
    {
      name = tiles
      swatchPrimary = tileBlack
      swatchSecondary = blank
      transform = Mk1StructuralHollowTilesLower
    }
  }
}
