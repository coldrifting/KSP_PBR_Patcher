@PART[MK1Fuselage]:AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[ReStockPBR/Assets/FuelTank/restock-pbr-fueltank-mk1-1]]
  {
    %model = ReStockPBR_Patch/Assets/FuelTank/restock-pbr-fueltank-mk1-1
  }

  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = Mk1FuelTiles
      transform = Mk1Fuel
    }

    COLORZONE
    {
      name = tiles
      swatchPrimary = tileBlack
      swatchSecondary = blank
      transform = Mk1FuelTilesLower
    }
  }
}
