@PART[mk2SpacePlaneAdapter]:AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[ReStockPBR/Assets/FuelTank/restock-pbr-adapter-mk2-short-1]]
  {
    %model = ReStockPBR_Patch/Assets/FuelTank/restock-pbr-adapter-mk2-short-1
  }

  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = Mk2AdapterShortTiles
      transform = Mk2AdapterShort
    }

    COLORZONE
    {
      name = tiles
      swatchPrimary = tileBlack
      swatchSecondary = blank
      transform = Mk2AdapterShortTilesLower
    }
  }
}
