@PART[mk2_1m_AdapterLong]:AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[ReStockPBR/Assets/FuelTank/restock-pbr-adapter-mk2-long-1]]
  {
    %model = ReStockPBR_Patch/Assets/FuelTank/restock-pbr-adapter-mk2-long-1
  }

  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = AdapterLongTiles
      transform = AdapterLong
    }

    COLORZONE
    {
      name = tiles
      swatchPrimary = tileBlack
      swatchSecondary = blank
      transform = AdapterLongTilesLower
    }
  }
}
