@PART[mk2Fuselage]:AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[ReStockPBR/Assets/FuelTank/restock-pbr-fueltank-mk2-long-lf-1]]
  {
    %model = ReStockPBR_Patch/Assets/FuelTank/restock-pbr-fueltank-mk2-long-lf-1
  }

  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = FuselageLongLiquidTiles
      transform = FuselageLongLiquid
    }

    COLORZONE
    {
      name = tiles
      swatchPrimary = tileBlack
      swatchSecondary = blank
      transform = Mk2FuselageLongLiquidTilesLower
    }
  }
}
