@PART[adapterEngines]:AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[ReStockPBR/Assets/FuelTank/restock-pbr-fueltank-adapter-mk3-shuttle-1]]
  {
    %model = ReStockPBR_Patch/Assets/FuelTank/restock-pbr-fueltank-adapter-mk3-shuttle-1
  }

  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = ShuttleEngineAdapterTiledB
      transform = ShuttleEngineAdapterTiledA
      transform = ShuttleEngineAdapter
    }

    COLORZONE
    {
      name = tiles
      swatchPrimary = tileBlack
      swatchSecondary = blank
      transform = ShuttleEngineAdapterTiledBLower
      transform = ShuttleEngineAdapterTiledALower
    }
  }
}
