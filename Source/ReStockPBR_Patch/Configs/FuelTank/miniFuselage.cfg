@PART[miniFuselage]:AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[ReStockPBR/Assets/FuelTank/restock-pbr-fueltank-mk0-1]]
  {
    %model = ReStockPBR_Patch/Assets/FuelTank/restock-pbr-fueltank-mk0-1
  }

  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = Mk0FuselageTiles
      transform = Mk0Fuselage
    }

    COLORZONE
    {
      name = tiles
      swatchPrimary = tileBlack
      swatchSecondary = blank
      transform = Mk0FuselageTilesLower
    }
  }
}
