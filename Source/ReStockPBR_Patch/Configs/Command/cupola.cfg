@PART[cupola]:NEEDS[ReStockPBR]:AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[ReStockPBR/Assets/Command/restock-pbr-cupola-1]]
  {
    %model = ReStockPBR_Patch/Assets/Command/restock-pbr-cupola-1
  }

  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = metalBasic
      transform = 25mCupolaBase
    }

    COLORZONE
    {
      name = sofi
      swatchPrimary = sofiWhite
      swatchSecondary = blank
      transform = 25mCupolaInsulated
    }

    COLORZONE
    {
      name = hatches
      swatchPrimary = porkjetWhite
      swatchSecondary = blank
      transform = CommonHatchOblong
      transform = CommonHatchOblongHandle
    }

    COLORZONE
    {
      name = ladders
      swatchPrimary = metalBasic
      swatchSecondary = porkjetBlack
      transform = 25mCupolaLadders
    }
  }
}
