@PART[Mark2Cockpit]:AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[ReStockPBR/Assets/Command/restock-pbr-cockpit-mk1-2]]
  {
    %model = ReStockPBR_Patch/Assets/Command/restock-pbr-cockpit-mk1-2
  }

  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = CockpitMk1InlineTiles
      transform = CockpitMk1Inline
      transform = CockpitMk1InlineHandle
    }

    COLORZONE
    {
      name = tiles
      swatchPrimary = tileBlack
      swatchSecondary = blank
      transform = CockpitMk1InlineTilesLower
    }
  }
}
