@PART[mk2LanderCabin_v2]:NEEDS[ReStockPBR]:AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[ReStockPBR/Assets/Command/restock-pbr-mk2-lander]]
  {
    %model = ReStockPBR_Patch/Assets/Command/restock-pbr-mk2-lander
  }

  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = RoverCoreCovered
      transform = RoverCoreCoveredWindows
      transform = RightSide
      transform = SideDoor004
      transform = SideDoor003
      transform = SideDoor005
      transform = SideDoor006
      transform = RoverCore
      transform = RoverCoreWindows
    }

    COLORZONE
    {
      name = hatches
      swatchPrimary = porkjetWhite
      swatchSecondary = blank
      transform = CommonHatchRound
      transform = CommonHatchRound
      transform = CommonHatchOblong
      transform = CommonHatchRound
      transform = CommonHatchRound
      transform = CommonHatchOblong
    }
  }
}
