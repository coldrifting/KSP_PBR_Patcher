@PART[MK1CrewCabin]:AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[ReStockPBR/Assets/Command/restock-pbr-crew-cabin-mk1-1]]
  {
    %model = ReStockPBR_Patch/Assets/Command/restock-pbr-crew-cabin-mk1-1
  }

  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = CabinMk1Tiles
      transform = CabinMk1
    }

    COLORZONE
    {
      name = tiles
      swatchPrimary = tileBlack
      swatchSecondary = blank
      transform = CabinMk1TilesLower
    }
  }
}
