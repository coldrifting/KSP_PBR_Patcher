@PART[Mark1Cockpit]:AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[ReStockPBR/Assets/Command/restock-pbr-cockpit-mk1-1]]
  {
    %model = ReStockPBR_Patch/Assets/Command/restock-pbr-cockpit-mk1-1
  }

  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = CockpitMk1FrontTiles
      transform = CockpitMk1Handle
      transform = CockpitMk1Front
    }

    COLORZONE
    {
      name = tiles
      swatchPrimary = tileBlack
      swatchSecondary = blank
      transform = CockpitMk1FrontTilesLower
    }
  }
}
