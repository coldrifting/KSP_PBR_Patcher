@PART[mk2Cockpit_Standard]:AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[ReStockPBR/Assets/Command/restock-pbr-cockpit-mk2-1]]
  {
    %model = ReStockPBR_Patch/Assets/Command/restock-pbr-cockpit-mk2-1
  }

  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = Mk2CockpitPointyTiles
      transform = Mk2CockpitPointy
      transform = CockpitMk2Handle
    }

    COLORZONE
    {
      name = tiles
      swatchPrimary = tileBlack
      swatchSecondary = blank
      transform = Mk2CockpitPointyTilesLower
    }
  }
}
