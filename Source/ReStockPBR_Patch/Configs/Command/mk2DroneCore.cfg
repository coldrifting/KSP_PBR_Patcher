@PART[mk2DroneCore]:NEEDS[ReStockPBR]:AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[ReStockPBR/Assets/Command/restock-pbr-drone-core-mk2-1]]
  {
    %model = ReStockPBR_Patch/Assets/Command/restock-pbr-drone-core-mk2-1
  }

  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = DroneCoreTiles
      transform = DroneCore
    }

    COLORZONE
    {
      name = tiles
      swatchPrimary = tileBlack
      swatchSecondary = blank
      transform = DroneCoreTilesLower
    }
  }
}
