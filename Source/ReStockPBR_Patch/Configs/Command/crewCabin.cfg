@PART[crewCabin]:NEEDS[ReStockPBR]:AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[ReStockPBR/Assets/Command/restock-pbr-hitchhiker-1]]
  {
    %model = ReStockPBR_Patch/Assets/Command/restock-pbr-hitchhiker-1
  }

  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = blank
      transform = 25mHitchikerLadders
      transform = 25mHitchiker
    }

    COLORZONE
    {
      name = hatches
      swatchPrimary = porkjetWhite
      swatchSecondary = blank
      transform = CommonHatchOblongHandle
      transform = CommonHatchOblongCurved
    }
  }
}
