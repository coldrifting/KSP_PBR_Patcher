// Replace material of non-PBR component
@PART[InflatableAirlock]:AFTER[ReStockPlus]
{
  SHABBY_MATERIAL_REPLACE
  {
    materialDef = restock-pbr-patch-crewed-endcap-2
    targetMaterial = restock-crewed-endcap-2
  }
}

@PART[restock-airlock-1]:AFTER[zzReStockPlus]:NEEDS[SquadExpansion/MakingHistory]
{
  SHABBY_MATERIAL_REPLACE
  {
    materialDef = restock-pbr-patch-crewed-endcap-2
    targetMaterial = restock-crewed-endcap-2
  }
}
