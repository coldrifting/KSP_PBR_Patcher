// Merge custom model with existing restock PBR nosecone
@PART[avionicsNoseCone]:HAS[~RestockIgnore[*]]:AFTER[000_ReStock]
{
  !MODEL,* {}
  MODEL
  {
    model = ReStockPBR/Assets/Aero/restock-pbr-nosecone-0625-1
  }
  MODEL
  {
    model = ReStockPBR_Patch/Assets/Control/avionics-nosecone-details
  }

  MODULE
  {
    name = ModuleTechnicolor
    
    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
    }
  }
}