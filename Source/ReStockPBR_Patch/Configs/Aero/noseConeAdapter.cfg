@PART[noseConeAdapter]:AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[ReStockPBR/Assets/Aero/restock-pbr-adapter-125-0625-1]]
  {
    %model = ReStockPBR_Patch/Assets/Aero/restock-pbr-adapter-125-0625-1
  }
  
  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = NoseConeTiles
      transform = NoseCone
    }

    COLORZONE
    {
      name = tiles
      swatchPrimary = tileBlack
      swatchSecondary = blank
      transform = NoseConeTilesLower
    }
  }
}
