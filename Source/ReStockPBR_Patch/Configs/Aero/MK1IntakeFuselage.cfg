@PART[MK1IntakeFuselage]:AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[ReStockPBR/Assets/Aero/restock-pbr-fuselage-mk1-intake-1]]
  {
    %model = ReStockPBR_Patch/Assets/Aero/restock-pbr-fuselage-mk1-intake-1
  }

  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = NacelleIntake
    }
  }
}
