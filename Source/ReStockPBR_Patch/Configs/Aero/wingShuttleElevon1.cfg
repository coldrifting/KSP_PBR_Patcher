@PART[wingShuttleElevon1]:AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[Squad/Parts/Aero/shuttleWings/ShuttleElevonA]]
  {
    %model = ReStockPBR_Patch/Assets/Aero/ShuttleElevonA
  }

  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = ShuttleElevonATiledLower
      transform = ShuttleElevonATiledUpper
      transform = ShuttleElevonA
    }

    COLORZONE
    {
      name = tiles
      swatchPrimary = tileBlack
      swatchSecondary = tileBlack
      transform = ShuttleElevonATiledLowerTiles
      transform = ShuttleElevonATiledUpperTiles
      transform = ShuttleElevonATiled
    }
  }
  
  MODULE
  {
    name = ModulePartVariants
    useMultipleDragCubes = false
    baseVariant = Base
    VARIANT
    {
      name = Base
      displayName = Bare
      primaryColor = #ffffff
      GAMEOBJECTS
      {
        ShuttleElevonA = true
        ShuttleElevonATiled = false
        ShuttleElevonATiledLower = false
        ShuttleElevonATiledUpper = false
      }
    }
    VARIANT
    {
      name = TilesBottom
      displayName = Tiled (Lower)
      primaryColor = #ffffff
      secondaryColor = #000000
      GAMEOBJECTS
      {
        ShuttleElevonA = false
        ShuttleElevonATiled = false
        ShuttleElevonATiledLower = true
        ShuttleElevonATiledUpper = false
      }
    }
    VARIANT
    {
      name = TilesTop
      displayName = Tiled (Upper)
      primaryColor = #000000
      secondaryColor = #ffffff
      GAMEOBJECTS
      {
        ShuttleElevonA = false
        ShuttleElevonATiled = false
        ShuttleElevonATiledLower = false
        ShuttleElevonATiledUpper = true
      }
    }
    VARIANT
    {
      name = Tiles
      displayName = Tiled
      primaryColor = #000000
      secondaryColor = #000000
      GAMEOBJECTS
      {
        ShuttleElevonA = false
        ShuttleElevonATiled = true
        ShuttleElevonATiledLower = false
        ShuttleElevonATiledUpper = false
      }
    }
  }
}
