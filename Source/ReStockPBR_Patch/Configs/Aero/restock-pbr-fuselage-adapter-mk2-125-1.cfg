@PART[restock-pbr-fuselage-adapter-mk2-125-1]:AFTER[ReStockPlusPBR]
{
  @MODEL,*:HAS[#model[ReStockPlusPBR/Assets/Aero/restock-pbr-fuselage-adapter-mk2-125-1]]
  {
    %model = ReStockPBR_Patch/Assets/Aero/restock-pbr-fuselage-adapter-mk2-125-1
  }

  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = Mk2Adapter3xTiled
      transform = Mk2Adapter3xBase
    }

    COLORZONE
    {
      name = tiles
      swatchPrimary = tileBlack
      swatchSecondary = blank
      transform = Mk2Adapter3xTiledLower
    }
  }
}
