@PART[restock-pbr-intake-mk2-adapter-1]:AFTER[ReStockPlusPBR]
{
  @MODEL,*:HAS[#model[ReStockPlusPBR/Assets/Aero/restock-pbr-intake-mk2-adapter-1]]
  {
    %model = ReStockPBR_Patch/Assets/Aero/restock-pbr-intake-mk2-adapter-1
  }

  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = Mk2AdapterIntakeTiled
      transform = Mk2AdapterIntake
    }

    COLORZONE
    {
      name = tiles
      swatchPrimary = tileBlack
      swatchSecondary = blank
      transform = Mk2AdapterIntakeTiledLower
    }
  }
}
