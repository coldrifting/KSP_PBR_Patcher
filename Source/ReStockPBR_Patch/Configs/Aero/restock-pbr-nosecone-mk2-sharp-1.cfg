@PART[restock-pbr-nosecone-mk2-sharp-1]:AFTER[ReStockPlusPBR]
{
  @MODEL,*:HAS[#model[ReStockPlusPBR/Assets/Aero/restock-pbr-nosecone-mk2-sharp-1]]
  {
    %model = ReStockPBR_Patch/Assets/Aero/restock-pbr-nosecone-mk2-sharp-1
  }
  
  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = Mk2NoseconeFlatTiled
      transform = Mk2NoseconeFlat
    }

    COLORZONE
    {
      name = tiles
      swatchPrimary = tileBlack
      swatchSecondary = blank
      transform = Mk2NoseconeFlatTiledLower
    }
  }
}
