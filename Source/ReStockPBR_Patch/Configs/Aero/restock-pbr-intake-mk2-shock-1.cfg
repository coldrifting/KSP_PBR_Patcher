@PART[restock-pbr-intake-mk2-shock-1]:AFTER[ReStockPlusPBR]
{
  @MODEL,*:HAS[#model[ReStockPlusPBR/Assets/Aero/restock-pbr-intake-mk2-shock-1]]
  {
    %model = ReStockPBR_Patch/Assets/Aero/restock-pbr-intake-mk2-shock-1
  }

  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = Mk2IntakeShockTiles
      transform = Mk2IntakeShock
    }

    COLORZONE
    {
      name = tiles
      swatchPrimary = tileBlack
      swatchSecondary = blank
      transform = Mk2IntakeShockTilesLower
    }
  }
  
  MODULE
  {
    name = ModulePartVariants
    useMultipleDragCubes = false
    baseVariant = BlackAndWhite

    VARIANT
    {
      name = Base
      displayName = Bare
      primaryColor = #ffffff

      GAMEOBJECTS
      {
        Mk2IntakeShock = true
        Mk2IntakeShockTiles = false
        Mk2IntakeShockTilesLower = false
      }
    }

    VARIANT
    {
      name = Tiles
      displayName = Tiled
      primaryColor = #000000
      secondaryColor = #ffffff

      GAMEOBJECTS
      {
        Mk2IntakeShock = false
        Mk2IntakeShockTiles = true
        Mk2IntakeShockTilesLower = true
      }
    }
  }
}
