@PART[restock-pbr-fuselage-precooler-mk2-1]:AFTER[ReStockPlusPBR]
{
  @MODEL,*:HAS[#model[ReStockPlusPBR/Assets/Aero/restock-pbr-fuselage-precooler-mk2-1]]
  {
    %model = ReStockPBR_Patch/Assets/Aero/restock-pbr-fuselage-precooler-mk2-1
  }

  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = FuselagePrecoolerTiled
      transform = FuselagePrecooler
    }

    COLORZONE
    {
      name = tiles
      swatchPrimary = tileBlack
      swatchSecondary = blank
      transform = FuselagePrecoolerTiledLower
    }
  }
}
