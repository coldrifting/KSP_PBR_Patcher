@PART[radialEngineBody]:AFTER[ReStockPBR]
{
  @MODEL,*:HAS[#model[ReStockPBR/Assets/Aero/restock-pbr-fuselage-mk1-precooler-1]]
  {
    %model = ReStockPBR_Patch/Assets/Aero/restock-pbr-fuselage-mk1-precooler-1
  }
  
  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = PrecoolerMk1Tiles
      transform = PrecoolerMk1
    }

    COLORZONE
    {
      name = tiles
      swatchPrimary = tileBlack
      swatchSecondary = blank
      transform = PrecoolerMk1TilesLower
    }
  }
}
