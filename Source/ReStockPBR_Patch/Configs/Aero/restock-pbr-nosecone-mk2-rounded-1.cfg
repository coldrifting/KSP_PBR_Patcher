@PART[restock-pbr-nosecone-mk2-rounded-1]:AFTER[ReStockPlusPBR]
{
  @MODEL,*:HAS[#model[ReStockPlusPBR/Assets/Aero/restock-pbr-nosecone-mk2-rounded-1]]
  {
    %model = ReStockPBR_Patch/Assets/Aero/restock-pbr-nosecone-mk2-rounded-1
  }

  !MODULE[ModuleTechnicolor],* {}
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = Mk2NoseBluntTiled
      transform = Mk2NoseBlunt
    }

    COLORZONE
    {
      name = tiles
      swatchPrimary = tileBlack
      swatchSecondary = blank
      transform = Mk2NoseBluntTiledLower
    }
  }
}
