# Medium-tech multispectral scanner
model: SCANsat/Parts/scansat-multi/scansat-multi-abi-1

color_zones:
  main:
    tc1: metalBasic
    materials:
      - scansat-multi-1
      - scansat-multi-2

  mli:
    tc1: mliGold
    materials:
      - scansat-multi-foil-1

operations:
  - remove_transforms:
      transforms: 
        - ABIFoil_Silver

  - remove_materials:
      materials: 
        - scansat-multi-foil-1-silver

  - rename_material:
      material: scansat-multi-foil-1-alt
