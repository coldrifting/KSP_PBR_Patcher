  - edit_material_textures:
      material: scansat-multi-foil-1
      bump_map: scansat-multi-foil-1-n

  - rename_material:
      material: scansat-multi-metal-1
      new_name: scansat-multi-2

  - remove_textures:
      textures:
        - scansat-multi-foil-1-s
        - scansat-multi-foil-1-silver
        - scansat-multi-foil-1-silver-s
        - scansat-multi-foil-1-alt-n
