size: [ 1024, 1024 ]

color_primary:
  - fill:
      color: white
      masks:
        - color_primary

color_secondary:
  - fill:
      color: white
      masks:
        - color_secondary

diffuse:
  - fill:
      image: SCANsat/Parts/scansat-resources/scansat-resources-1.dds
      channels: rgb

  - saturation:
      percent: 120
      masks:
        - inputs

  - saturation:
      percent: 160
      masks:
        - wires

  - curves:
      points:
        - [128, 85]
      masks:
        - color_primary

  - curves:
      points:
        - [64, 85]

  - curves:
      points:
        - [64, 128]
      masks:
        - metal_1

  - curves:
      points:
        - [64, 100]
      masks:
        - metal_2

gloss:
  - fill:
      image: SCANsat/Parts/scansat-resources/scansat-resources-1.dds
      channels: a

  - curves:
      points:
        - [64, 115]

  - curves:
      points:
        - [86, 190]
      masks:
        - gloss_correction

  - curves:
      points:
        - [55, 160]
        - [128, 225]
      masks:
        - wires

gloss_alt:
  - copy:
      group: gloss

  - brightness:
      percent: 50
      masks:
        - color_primary
        - color_secondary

metal:
  - fill:
      color: white
      masks:
        - bg!
        - wires!
        - inputs!

metal_alt:
  - copy:
      group: metal

  - fill:
      color: black
      masks:
        - color_primary
        - color_secondary
