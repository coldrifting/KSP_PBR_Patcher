size: [ 512, 512 ]

color_primary:
  - fill:
      color: white
      masks:
        - color_primary
        - color_secondary

color_secondary:
  - fill:
      color: white
      masks:
        - color_secondary

diffuse:
  - fill:
      image: SCANsat/Parts/scansat-btdt/scansat-btdt-1.dds
      channels: rgb

  - saturation:
      percent: 0
      masks:
        - bg!
        - saturate!

  - saturation:
      percent: 120
      masks:
        - saturate

  - curves:
      points:
        - [64, 115]
      masks:
        - metal_1

  - curves:
      points:
        - [128, 80]
        - [255, 200]
      masks:
        - paint

  - brightness:
      percent: 135
      masks:
        - mli

gloss:
  - fill:
      image: SCANsat/Parts/scansat-btdt/scansat-btdt-1.dds
      channels: a

  - curves:
      points:
        - [64, 192]
        - [128, 224]
      masks:
        - gloss_correction

  - brightness:
      percent: 150
      masks:
        - mli

  - curves:
      points:
        - [64, 107]

gloss_alt:
  - copy:
      group: gloss

  - brightness:
      percent: 50
      masks:
        - color_primary
        - color_secondary

metal:
  - fill:
      color: white
      masks:
        - metal

metal_alt:
  - copy:
      group: metal

  - fill:
      color: black
      masks:
        - color_primary
        - color_secondary
