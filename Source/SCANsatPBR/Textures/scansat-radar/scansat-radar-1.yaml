size: [ 512, 512 ]

color_primary:
  - fill:
      color: white
      masks:
        - color_primary
        - color_secondary

color_secondary:
  - fill:
      color: white
      masks:
        - color_secondary

diffuse:
  - fill:
      image: SCANsat/Parts/scansat-radar/scansat-radar-1.dds
      channels: rgb

  - saturation:
      percent: 0
      masks:
        - bg!
        - saturate!

  - saturation:
      percent: 120
      masks:
        - saturate
        - wires!

  - saturation:
      percent: 160
      masks:
        - wires

  - curves:
      points:
        - [64, 75]
      masks:
        - bg!
        - dish_segment!

  - curves:
      points:
        - [128, 64]
      masks:
        - dish_segment

gloss:
  - fill:
      image: SCANsat/Parts/scansat-radar/scansat-radar-1.dds
      channels: a

  - curves:
      points:
        - [64, 110]

  - curves:
      points:
        - [40, 128]
        - [100, 200]
      masks:
        - color_secondary

  - curves:
      points:
        - [55, 160]
        - [128, 225]
      masks:
        - wires

gloss_alt:
  - copy:
      group: gloss

  - brightness:
      percent: 50
      masks:
        - color_primary
        - color_secondary

metal:
  - fill:
      color: white
      masks:
        - bg!
        - wires!

metal_alt:
  - copy:
      group: metal

  - fill:
      color: black
      masks:
        - color_primary
        - color_secondary
