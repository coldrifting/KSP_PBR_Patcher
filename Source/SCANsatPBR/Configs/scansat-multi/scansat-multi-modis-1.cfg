@PART[scansat-multi-modis-1]:AFTER[SCANsat]
{
  @MODEL,*:HAS[#model[SCANsat/Parts/scansat-multi/scansat-multi-modis-1]]
  {
    %model = SCANsatPBR/Parts/scansat-multi/scansat-multi-modis-1
  }
  
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = metalBasic
      swatchSecondary = blank
      transform = MODISBase
      transform = MODISLensCap
      transform = MODIS_Metal
    }

    COLORZONE
    {
      name = mli
      swatchPrimary = mliGold
      swatchSecondary = blank
      transform = MODIS_Foil
    }
  }

  @MODULE[ModulePartVariants]
  {
    !VARIANT[Silver] {}

    @VARIANT,*
    {
      !MODIS_Foil_Silver = DELETE
    }

    @VARIANT[Gold]
    {
      %displayName = Foil
    }
  }
}
