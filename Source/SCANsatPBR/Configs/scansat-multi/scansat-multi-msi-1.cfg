@PART[scansat-multi-msi-1]:AFTER[SCANsat]
{
  @MODEL,*:HAS[#model[SCANsat/Parts/scansat-multi/scansat-multi-msi-1]]
  {
    %model = SCANsatPBR/Parts/scansat-multi/scansat-multi-msi-1
  }
  
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = metalBasic
      swatchSecondary = blank
      transform = MSIBase
      transform = MSILensCap
      transform = MSI_Metal
    }

    COLORZONE
    {
      name = mli
      swatchPrimary = mliGold
      swatchSecondary = blank
      transform = MSI_Foil
    }
  }

  @MODULE[ModulePartVariants]
  {
    !VARIANT[Silver] {}

    @VARIANT,*
    {
      !MSI_Foil_Silver = DELETE
    }

    @VARIANT[Gold]
    {
      %displayName = Foil
    }
  }
}
