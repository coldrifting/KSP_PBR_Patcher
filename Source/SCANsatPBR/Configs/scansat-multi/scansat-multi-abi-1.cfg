@PART[scansat-multi-abi-1]:AFTER[SCANsat]
{
  @MODEL,*:HAS[#model[SCANsat/Parts/scansat-multi/scansat-multi-abi-1]]
  {
    %model = SCANsatPBR/Parts/scansat-multi/scansat-multi-abi-1
  }
  
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = metalBasic
      swatchSecondary = blank
      transform = ABILensCap
      transform = ABIMetal
      transform = ABIBase
    }

    COLORZONE
    {
      name = mli
      swatchPrimary = mliGold
      swatchSecondary = blank
      transform = ABIFoil
    }
  }

  @MODULE[ModulePartVariants]
  {
    !VARIANT[Silver] {}

    @VARIANT,*
    {
      !ABIFoil_Silver = DELETE
    }

    @VARIANT[Gold]
    {
      %displayName = Foil
    }
  }
}
