@PART[scansat-exomars-1]:AFTER[SCANsat]
{
  @MODEL,*:HAS[#model[SCANsat/Parts/scansat-btdt/scansat-exomars-1]]
  {
    %model = SCANsatPBR/Parts/scansat-btdt/scansat-exomars-1
  }
  
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = metalBasic
      transform = EMBaseBare
      transform = EMBase
      transform = EMDoor
      transform = EMBasePitchBare
      transform = EMBasePitch
      transform = EMCylLower
      transform = EMTopPivot
      transform = EMCameraMLIBare
      transform = EMCameraBare
      transform = EMCamera
      transform = EMAntenna
    }

    COLORZONE
    {
      name = mli
      swatchPrimary = mliGold
      swatchSecondary = blank
      transform = EMCameraMLI
    }
  }
}
