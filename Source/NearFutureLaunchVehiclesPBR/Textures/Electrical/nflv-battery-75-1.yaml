size: [1024, 1024]

color_primary:
  - fill:
      color: white
      masks:
        - color_primary

color_secondary:
  - fill:
      image: color_secondary

diffuse:
  - fill:
      image: NearFutureLaunchVehicles/Parts/Electrical/nflv-battery-75-1.dds
      channels: rgb

  - saturation:
      percent: 120
      masks:
        - wires
        - lights
        - paint_yellow

  - saturation:
      percent: 0
      masks:
        - bg!
        - wires!
        - lights!
        - paint_yellow!

  - curves:
      points:
        - [40, 128]
        - [96, 210]
      masks:
        - diff_dark_1

  - fill:
      image: stripe_removal

  - curves:
      points:
        - [64, 85]
      masks:
        - bg!
        - diff_dark_1!
        - diff_dark_2!

gloss:
  - fill:
      image: NearFutureLaunchVehicles/Parts/Electrical/nflv-battery-75-1.dds
      channels: a

  - curves:
      points:
        - [20, 128]
        - [48, 200]
        - [100, 235]
      masks:
        - gloss_dark

  - curves:
      points:
        - [0, 200]
      masks:
        - wires

  - curves:
      points:
        - [64, 110]
      masks:
        - bg!
        - gloss_dark!
        - wires!

gloss_alt:
  - copy:
      group: gloss

  - brightness:
      percent: 50
      masks:
        - color_primary

metal:
  - fill:
      color: white
      masks:
        - bg!
        - wires!
        - lights!
        - paint_yellow!

metal_alt:
  - copy:
      group: metal

  - fill:
      color: black
      masks:
        - color_primary
