size: [1024, 1024]

color_primary:
  - fill:
      color: white
      masks:
        - color_primary

color_secondary:
  - fill:
      color: white
      masks:
        - color_secondary

diffuse:
  - fill:
      image: NearFutureLaunchVehicles/Parts/Engine/nflv-engine-ar1-1.dds
      channels: rgb

  - curves:
      points:
        - [64, 82]
      masks:
        - bg!
        - paint_1!
        - paint_2!

  - curves:
      points:
        - [40, 128]
        - [128, 220]
      masks:
        - paint_1

  - curves:
      points:
        - [128, 90]
        - [255, 230]
      masks:
        - paint_2

gloss:
  - fill:
      image: NearFutureLaunchVehicles/Parts/Engine/nflv-engine-ar1-1.dds
      channels: a

  - curves:
      points:
        - [64, 105]
      masks:
        - bg!
        - gloss_dark!
        - engine!

  - curves:
      points:
        - [16, 128]
        - [45, 203]
      masks:
        - gloss_dark

  - curves:
      points:
        - [15, 128]
        - [34, 192]
        - [92, 232]
      masks:
        - engine

gloss_alt:
  - copy:
      group: gloss

  - brightness:
      percent: 50
      masks:
        - color_primary
        - color_secondary

metal:
  - fill:
      color: white

metal_alt:
  - copy:
      group: metal

  - fill:
      color: black
      masks:
        - color_primary
        - color_secondary
