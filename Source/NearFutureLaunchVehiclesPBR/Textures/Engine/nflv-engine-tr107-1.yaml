size: [1024, 1024]

color_primary:
  - fill:
      color: white
      masks:
        - color_primary

color_secondary:
  - fill:
      color: white
      masks:
        - color_secondary

diffuse:
  - fill:
      image: NearFutureLaunchVehicles/Parts/Engine/nflv-engine-tr107-1.dds
      channels: rgb

  - fill:
      image: stripe_removal

  - curves:
      points:
        - [94, 25]
        - [164, 66]
      masks:
        - diffuse_light

  - curves:
      points:
        - [45, 128]
        - [113, 200]
      masks:
        - diffuse_dark

  - curves:
      points:
        - [64, 72]
      masks:
        - bg!
        - diffuse_light!
        - diffuse_dark!

gloss:
  - fill:
      image: NearFutureLaunchVehicles/Parts/Engine/nflv-engine-tr107-1.dds
      channels: a

  - curves:
      points:
        - [17, 128]
        - [46, 200]
      masks:
        - gloss_dark

  - curves:
      points:
        - [64, 95]
      masks:
        - bg!
        - gloss_dark!

gloss_alt:
  - copy:
      group: gloss

  - brightness:
      percent: 50
      masks:
        - color_primary
        - color_secondary

metal:
  - fill:
      color: white

metal_alt:
  - copy:
      group: metal

  - fill:
      color: black
      masks:
        - color_primary
        - color_secondary
