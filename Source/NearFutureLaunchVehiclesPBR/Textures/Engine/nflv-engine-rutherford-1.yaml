size: [512, 512]

color_primary:
  - fill:
      color: white
      masks:
        - color_primary

color_secondary:
  - fill:
      color: white
      masks:
        - color_secondary

diffuse:
  - fill:
      image: NearFutureLaunchVehicles/Parts/Engine/nflv-engine-rutherford-1.dds
      channels: rgb

  - saturation:
      percent: 0
      masks:
        - color_primary
        - color_secondary

  - curves:
      points:
        - [128, 115]
        - [255, 160]
      masks:
        - diffuse_light

  - curves:
      points:
        - [255, 180]
      masks:
        - diffuse_light_2

  - curves:
      points:
        - [42, 128]
        - [100, 210]
      masks:
        - diffuse_dark

  - curves:
      points:
        - [64, 72]
      masks:
        - bg!
        - diffuse_light!
        - diffuse_light_2!
        - diffuse_dark!

gloss:
  - fill:
      image: NearFutureLaunchVehicles/Parts/Engine/nflv-engine-rutherford-1.dds
      channels: a

  - curves:
      points:
        - [17, 128]
        - [46, 200]
      masks:
        - gloss_dark

  - curves:
      points:
        - [16, 128]
        - [36, 190]
        - [74, 220]
      masks:
        - engine

  - curves:
      points:
        - [64, 95]
      masks:
        - bg!
        - gloss_dark!
        - engine!

gloss_alt:
  - copy:
      group: gloss

  - brightness:
      percent: 50
      masks:
        - color_primary
        - color_secondary

metal:
  - fill:
      color: white

metal_alt:
  - copy:
      group: metal

  - fill:
      color: black
      masks:
        - color_primary
        - color_secondary
