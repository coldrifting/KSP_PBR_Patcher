size: [2048, 2048]

color_primary:
  - fill:
      color: white
      masks:
        - color_primary

color_secondary:
  - fill:
      color: white
      masks:
        - color_secondary

diffuse:
  - fill:
      image: NearFutureLaunchVehicles/Parts/Structural/Mounting/nflv-clusters-2.dds
      channels: rgb

  - fill:
      image: paint_fix

  - saturation:
      percent: 0
      masks:
        - bg!
        - wires!
        - text!
        - bulkhead!

  - saturation:
      percent: 160
      masks:
        - wires
        - text
        - bulkhead

  - curves:
      points:
        - [255, 180]
      masks:
        - diff_light

  - curves:
      points:
        - [24, 84]
        - [115, 210]
      masks:
        - diff_dark

  - curves:
      points:
        - [64, 105]
      masks:
        - mli

  - curves:
      points:
        - [64, 84]
      masks:
        - bg!
        - diff_light!
        - diff_dark!
        - mli!

gloss:
  - fill:
      image: NearFutureLaunchVehicles/Parts/Structural/Mounting/nflv-clusters-2.dds
      channels: a

  - fill:
      image: NearFutureLaunchVehicles/Parts/Structural/Mounting/nflv-clusters-2-s.dds
      channels: rgb
      masks:
        - mli

  - saturation:
      percent: 0
      masks:
        - mli

  - curves:
      points:
        - [64, 140]
        - [128, 200]
      masks:
        - mli

  - curves:
      points:
        - [0, 180]
      masks:
        - wires

  - curves:
      points:
        - [22, 64]
      masks:
        - bulkhead

  - curves:
      points:
        - [21, 128]
        - [63, 213]
      masks:
        - gloss_dark

  - curves:
      points:
        - [64, 98]
      masks:
        - bg!
        - mli!
        - wires!
        - bulkhead!
        - gloss_dark!

gloss_alt:
  - copy:
      group: gloss

  - brightness:
      percent: 50
      masks:
        - color_primary
        - color_secondary

metal:
  - fill:
      color: white

metal_alt:
  - copy:
      group: metal

  - fill:
      color: black
      masks:
        - color_primary
        - color_secondary
