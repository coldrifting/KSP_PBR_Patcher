size: [1024, 1024]

color_primary:
  - fill:
      color: white
      masks:
        - color_primary

color_secondary:
  - fill:
      color: black

diffuse:
  - fill:
      image: NearFutureLaunchVehicles/Parts/Structural/nflv-structural-tubes-1.dds
      channels: rgb

  - saturation:
      percent: 0

  - curves:
      points:
        - [64, 85]
      masks:
        - diff_metal

  - curves:
      points:
        - [255, 180]
      masks:
        - diff_light

  - curves:
      points:
        - [34, 100]
        - [100, 200]
      masks:
        - diff_dark

gloss:
  - fill:
      image: NearFutureLaunchVehicles/Parts/Structural/nflv-structural-tubes-1.dds
      channels: a

  - curves:
      points:
        - [64, 98]
      masks:
        - bg!
        - gloss_dark!

  - curves:
      points:
        - [21, 128]
        - [63, 213]
      masks:
        - gloss_dark

gloss_alt:
  - copy:
      group: gloss

  - brightness:
      percent: 50
      masks:
        - color_primary

metal:
  - fill:
      color: white

metal_alt:
  - copy:
      group: metal

  - fill:
      color: black
      masks:
        - color_primary
