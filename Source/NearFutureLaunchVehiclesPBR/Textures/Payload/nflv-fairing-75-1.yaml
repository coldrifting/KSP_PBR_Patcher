size: [1024, 1024]

color_primary:
  - fill:
      color: white
      masks:
        - color_primary

color_secondary:
  - fill:
      color: white
      masks:
        - color_secondary

diffuse:
  - fill:
      image: NearFutureLaunchVehicles/Parts/Payload/nflv-fairing-75-1.dds
      channels: rgb

  - fill:
      image: stripe_removal

  - saturation:
      percent: 160
      masks:
        - wires

  - saturation:
      percent: 0
      masks:
        - bg!
        - wires!

  - curves:
      points:
        - [24, 96]
        - [80, 196]
      masks:
        - diff_dark

  - curves:
      points:
        - [255, 180]
      masks:
        - diff_light

  - curves:
      points:
        - [64, 90]
      masks:
        - bg!
        - diff_dark!
        - diff_light!

gloss:
  - fill:
      image: NearFutureLaunchVehicles/Parts/Payload/nflv-fairing-75-1.dds
      channels: a

  - curves:
      points:
        - [64, 112]
      masks:
        - bg!
        - gloss_dark!

  - curves:
      points:
        - [21, 128]
        - [63, 213]
      masks:
        - gloss_dark

  - fill:
      image: text

gloss_alt:
  - copy:
      group: gloss

  - brightness:
      percent: 50
      masks:
        - color_primary
        - color_secondary

metal:
  - fill:
      color: white
      masks:
        - bg!
        - wires!

  - fill:
      image: text

metal_alt:
  - copy:
      group: metal

  - fill:
      color: black
      masks:
        - color_primary
        - color_secondary
