size: [512, 512]

color_primary:
  - fill:
      color: white
      masks:
        - color_primary

color_secondary:
  - fill:
      color: white
      masks:
        - color_secondary

diffuse:
  - fill:
      image: NearFutureLaunchVehicles/Parts/RCS/nflv-rcs-integrated-1.dds
      channels: rgb

  - saturation:
      percent: 0
      masks:
        - bg!
        - wires!
        - lights!

  - saturation:
      percent: 120
      masks:
        - wires
        - lights

  - curves:
      points:
        - [64, 85]

gloss:
  - fill:
      image: NearFutureLaunchVehicles/Parts/RCS/nflv-rcs-integrated-1.dds
      channels: a

  - curves:
      points:
        - [20, 128]
        - [48, 200]
        - [100, 235]
      masks:
        - gloss_dark

  - curves:
      points:
        - [0, 200]
      masks:
        - wires

  - curves:
      points:
        - [64, 110]
      masks:
        - bg!
        - gloss_dark!
        - wires!

gloss_alt:
  - copy:
      group: gloss

  - brightness:
      percent: 50
      masks:
        - color_primary
        - color_secondary

metal:
  - fill:
      color: white
      masks:
        - bg!
        - wires!
        - lights!

metal_alt:
  - copy:
      group: metal

  - fill:
      color: black
      masks:
        - color_primary
        - color_secondary
