size: [1024, 1024]

color_primary:
  - fill:
      color: white
      masks:
        - color_primary

color_secondary:
  - fill:
      color: white
      masks:
        - color_secondary

diffuse:
  - fill:
      image: NearFutureLaunchVehicles/Parts/Coupling/nflv-decoupler-75-1.dds
      channels: rgb

  - fill:
      image: stripe_removal

  - saturation:
      percent: 120
      masks:
        - wires
        - warning
        - paint_stripe
        - arrows

  - saturation:
      percent: 0
      masks:
        - bg!
        - wires!
        - warning!
        - paint_stripe!
        - arrows!

  - curves:
      points:
        - [255, 185]
      masks:
        - diff_light

  - curves:
      points:
        - [64, 85]
      masks:
        - bg!
        - diff_light!

gloss:
  - fill:
      image: NearFutureLaunchVehicles/Parts/Coupling/nflv-decoupler-75-1.dds
      channels: a

  - curves:
      points:
        - [20, 128]
        - [48, 200]
        - [100, 235]
      masks:
        - gloss_dark

  - curves:
      points:
        - [0, 200]
      masks:
        - wires

  - curves:
      points:
        - [64, 110]
      masks:
        - bg!
        - gloss_dark!
        - wires!

gloss_alt:
  - copy:
      group: gloss

  - brightness:
      percent: 50
      masks:
        - color_primary
        - color_secondary

metal:
  - fill:
      color: white
      masks:
        - bg!
        - wires!
        - warning!
        - paint_stripe!
        - arrows!

metal_alt:
  - copy:
      group: metal

  - fill:
      color: black
      masks:
        - color_primary
        - color_secondary
