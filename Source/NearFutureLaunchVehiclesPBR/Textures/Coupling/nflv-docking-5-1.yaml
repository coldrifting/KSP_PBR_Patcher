size: [512, 512]

color_primary:
  - fill:
      color: white
      masks:
        - color_primary

color_secondary:
  - fill:
      color: black

diffuse:
  - fill:
      image: NearFutureLaunchVehicles/Parts/Coupling/nflv-docking-5-1.dds
      channels: rgb

  - saturation:
      percent: 120
      masks:
        - lights
        - paint_stripe

  - saturation:
      percent: 0
      masks:
        - bg!
        - lights!
        - paint_stripe!

  - curves:
      points:
        - [255, 185]
      masks:
        - diff_light

  - curves:
      points:
        - [64, 85]
      masks:
        - bg!
        - diff_light!

gloss:
  - fill:
      image: NearFutureLaunchVehicles/Parts/Coupling/nflv-docking-5-1.dds
      channels: a

  - curves:
      points:
        - [20, 128]
        - [48, 200]
        - [100, 235]
      masks:
        - gloss_dark

  - curves:
      points:
        - [64, 110]
      masks:
        - bg!
        - gloss_dark!

gloss_alt:
  - copy:
      group: gloss

  - brightness:
      percent: 50
      masks:
        - color_primary

metal:
  - fill:
      color: white
      masks:
        - bg!
        - lights!
        - paint_stripe!

metal_alt:
  - copy:
      group: metal

  - fill:
      color: black
      masks:
        - color_primary
