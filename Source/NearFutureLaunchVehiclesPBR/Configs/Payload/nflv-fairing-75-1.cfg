@PART[nflv-fairing-75-1]:AFTER[NearFutureLaunchVehicles]
{
  @MODEL,*:HAS[#model[NearFutureLaunchVehicles/Parts/Payload/nflv-fairing-75-1]]
  {
    %model = NearFutureLaunchVehiclesPBR/Assets/Payload/nflv-fairing-75-1
  }

  !MODULE[ModulePartVariants],* {}

  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetGrey
      transform = 75FaringWhite
    }

    COLORZONE
    {
      name = shrouds
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetGrey
      transform = FairingIconDummy
    }

    FAIRING_TEXTURES
    {
      FairingAlbedoTexture = ReStockPBR/Assets/Payload/restock-pbr-fairing-25-1-a
      FairingMetalTexture = ReStockPBR/Assets/Payload/restock-pbr-fairing-25-1-m
      FairingNormalTexture = ReStockPBR/Assets/Payload/restock-pbr-fairing-25-1-n
      FairingTCTexture = ReStockPBR/Assets/Payload/restock-pbr-fairing-25-1-tc
      CapAlbedoTexture = ReStockPBR/Assets/Payload/restock-pbr-fairing-cap-1-a
      CapMetalTexture = ReStockPBR/Assets/Payload/restock-pbr-fairing-cap-1-m
      CapNormalTexture = ReStockPBR/Assets/Payload/restock-pbr-fairing-cap-1-n
      CapTCTexture = ReStockPBR/Assets/Payload/restock-pbr-fairing-cap-1-tc
    }
  }
}