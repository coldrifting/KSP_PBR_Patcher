@PART[nflv-fueltank-5-4]:AFTER[NearFutureLaunchVehicles]
{
  @MODEL,*:HAS[#model[NearFutureLaunchVehicles/Parts/FuelTank/nflv-fueltank-5-4]]
  {
    %model = NearFutureLaunchVehiclesPBR/Assets/FuelTank/nflv-fueltank-5-4
  }

  @MODEL,*:HAS[#model[NearFutureLaunchVehicles/Parts/FuelTank/nflv-fueltank-5-endcap-2]]
  {
    %model = NearFutureLaunchVehiclesPBR/Assets/FuelTank/nflv-fueltank-5-endcap-2
  }
  
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = 5mMiniWhite
      transform = 5mMiniBlackWhite
    }

    COLORZONE
    {
      name = insulation
      swatchPrimary = sofiOrange
      swatchSecondary = sofiYellow
      transform = 5mMiniOrange
    }
  }
}