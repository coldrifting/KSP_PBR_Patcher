@PART[nflv-fueltank-adapter-5-375-1]:AFTER[NearFutureLaunchVehicles]
{
  @MODEL,*:HAS[#model[NearFutureLaunchVehicles/Parts/FuelTank/nflv-fueltank-adapter-5-375-1]]
  {
    %model = NearFutureLaunchVehiclesPBR/Assets/FuelTank/nflv-fueltank-adapter-5-375-1
  }
  
  @MODEL,*:HAS[#model[NearFutureLaunchVehicles/Parts/FuelTank/nflv-fueltank-375-endcap-1]]
  {
    %model = NearFutureLaunchVehiclesPBR/Assets/FuelTank/nflv-fueltank-375-endcap-1
  }

  @MODEL,*:HAS[#model[NearFutureLaunchVehicles/Parts/FuelTank/nflv-fueltank-5-endcap-3]]
  {
    %model = NearFutureLaunchVehiclesPBR/Assets/FuelTank/nflv-fueltank-5-endcap-3
  }

  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = 5mAdaptLongBlackWhite
    }

    COLORZONE
    {
      name = insulation
      swatchPrimary = sofiOrange
      swatchSecondary = sofiYellow
      transform = 5mAdaptLongOrange
    }
  }

  @MODULE[ModuleB9PartSwitch],*:HAS[#moduleID[appearanceSwitch]]
  {
    !SUBTYPE[White] {}
  }
}
