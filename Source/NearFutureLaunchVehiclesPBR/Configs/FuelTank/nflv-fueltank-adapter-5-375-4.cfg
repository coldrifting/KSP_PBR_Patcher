@PART[nflv-nflv-fueltank-adapter-5-375-4]:AFTER[NearFutureLaunchVehicles]
{
  @MODEL,*:HAS[#model[NearFutureLaunchVehicles/Parts/FuelTank/nflv-fueltank-adapter-5-375-4]]
  {
    %model = NearFutureLaunchVehiclesPBR/Assets/FuelTank/nflv-fueltank-adapter-5-375-4
  }

  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = 5mAdaptFlatBlackWhite
      transform = 5mAdaptFlat
    }

    COLORZONE
    {
      name = insulation
      swatchPrimary = sofiOrange
      swatchSecondary = sofiYellow
      transform = 5mAdaptFlatOrange
    }
  }
}
