@PART[nflv-fueltank-5-1]:AFTER[NearFutureLaunchVehicles]
{
  @MODEL,*:HAS[#model[NearFutureLaunchVehicles/Parts/FuelTank/nflv-fueltank-5-1]]
  {
    %model = NearFutureLaunchVehiclesPBR/Assets/FuelTank/nflv-fueltank-5-1
  }

  @MODEL,*:HAS[#model[NearFutureLaunchVehicles/Parts/FuelTank/nflv-fueltank-5-endcap-1]]
  {
    %model = NearFutureLaunchVehiclesPBR/Assets/FuelTank/nflv-fueltank-5-endcap-1
  }
  
  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = 5mLongWhite
      transform = 5mLongBlackWhite
    }

    COLORZONE
    {
      name = insulation
      swatchPrimary = sofiOrange
      swatchSecondary = sofiYellow
      transform = 5mLongOrange
    }
  }
}