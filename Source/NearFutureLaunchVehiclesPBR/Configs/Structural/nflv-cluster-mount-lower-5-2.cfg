@PART[nflv-cluster-mount-lower-5-2]:AFTER[NearFutureLaunchVehicles]
{
  @MODEL,*:HAS[#model[NearFutureLaunchVehicles/Parts/Structural/Mounting/nflv-cluster-mount-lower-5-2]]
  {
    %model = NearFutureLaunchVehiclesPBR/Assets/Structural/nflv-cluster-mount-lower-5-2
  }

  @MODEL,*:HAS[#model[NearFutureLaunchVehicles/Parts/FuelTank/nflv-fueltank-5-endcap-2]]
  {
    %model = NearFutureLaunchVehiclesPBR/Assets/FuelTank/nflv-fueltank-5-endcap-2
  }

  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = 5mClusterSLS4x
      transform = 5mClusterSLS3x
      transform = 5mClusterSLS2x
    }

    COLORZONE
    {
      name = tiles
      swatchPrimary = tileBlack
      swatchSecondary = blank
      transform = 5mClusterSLS4x_Tiles
      transform = 5mClusterSLS3x_Tiles
      transform = 5mClusterSLS2x_Tiles
    }
  }
}