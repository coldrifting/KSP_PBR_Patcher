@PART[nflv-cluster-mount-lower-5-1]:AFTER[NearFutureLaunchVehicles]
{
  @MODEL,*:HAS[#model[NearFutureLaunchVehicles/Parts/Structural/Mounting/nflv-cluster-mount-lower-5-1]]
  {
    %model = NearFutureLaunchVehiclesPBR/Assets/Structural/nflv-cluster-mount-lower-5-1
  }

  @MODEL,*:HAS[#model[NearFutureLaunchVehicles/Parts/FuelTank/nflv-fueltank-5-endcap-3]]
  {
    %model = NearFutureLaunchVehiclesPBR/Assets/FuelTank/nflv-fueltank-5-endcap-3
  }

  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = 5mClusterEnergia6x
      transform = 5mClusterEnergia4x
      transform = 5mClusterEnergia3x
      transform = 5mClusterEnergia2x
      transform = 5mClusterEnergia1x
    }
  }
}