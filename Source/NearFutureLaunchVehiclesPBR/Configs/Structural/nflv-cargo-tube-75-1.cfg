@PART[nflv-cargo-tube-75-1]:AFTER[NearFutureLaunchVehicles]
{
  @MODEL,*:HAS[#model[NearFutureLaunchVehicles/Parts/Structural/nflv-cargo-tube-75-1]]
  {
    %model = NearFutureLaunchVehiclesPBR/Assets/Structural/nflv-cargo-tube-75-1
  }

  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = 75mInterstageWhiteFlat
      transform = 75mInterstageBlack
      transform = 75mInterstageWhiteFlat
      transform = 75mInterstageBlack
      transform = 75mInterstageWhiteFlat
      transform = 75mInterstageBlack
      transform = 75mInterstageWhiteFlat
      transform = 75mInterstageBlack
      transform = 75mInterstageWhiteFlat
      transform = 75mInterstageBlack
    }
  }

  @MODULE[ModuleB9PartSwitch],*:HAS[#moduleID[shroudColor]]
  {
    !SUBTYPE[Black] {}
    !SUBTYPE[BlackFlat] {}
  }
}
