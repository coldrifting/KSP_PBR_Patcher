@PART[nflv-cluster-mount-upper-75-2]:AFTER[NearFutureLaunchVehicles]
{
  @MODEL,*:HAS[#model[NearFutureLaunchVehicles/Parts/Structural/Mounting/nflv-cluster-mount-upper-75-2]]
  {
    %model = NearFutureLaunchVehiclesPBR/Assets/Structural/nflv-cluster-mount-upper-75-2
  }

  !MODULE[ModuleB9PartSwitch],*:HAS[#moduleID[shroudColor]] {}

  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = 75mInterstageShort
      transform = 75mEndcapStruct (2)
      transform = OuterRing8x
      transform = OuterRing4x
      transform = OuterRing2x
      transform = OuterRing0x
      transform = InnerRing4x
      transform = InnerRing2x
      transform = InnerRing0x_2
      transform = InnerRing0x
      transform = 75mUpperMount1Outer
    }

    COLORZONE
    {
      name = shrouds
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = 75mInterstageMedShort
      transform = 75mInterstageMedLong
      transform = 75mInterstageMed
      transform = 75mInterstageLong
    }
  }
}
