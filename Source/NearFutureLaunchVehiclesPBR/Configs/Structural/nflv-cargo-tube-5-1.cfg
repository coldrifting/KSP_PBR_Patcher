@PART[nflv-cargo-tube-5-1]:AFTER[NearFutureLaunchVehicles]
{
  @MODEL,*:HAS[#model[NearFutureLaunchVehicles/Parts/Structural/nflv-cargo-tube-5-1]]
  {
    %model = NearFutureLaunchVehiclesPBR/Assets/Structural/nflv-cargo-tube-5-1
  }

  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = 5mInterstageDecouplerWhiteFlat
      transform = 5mInterstageDecouplerWhite
      transform = 5mInterstageDecouplerWhiteFlat
      transform = 5mInterstageDecouplerWhite
      transform = 5mInterstageDecouplerWhiteFlat
      transform = 5mInterstageDecouplerWhite
      transform = 5mInterstageDecouplerWhiteFlat
      transform = 5mInterstageDecouplerWhite
      transform = 5mInterstageDecouplerWhiteFlat
      transform = 5mInterstageDecouplerWhite
    }
  }

  @MODULE[ModuleB9PartSwitch],*:HAS[#moduleID[shroudColor]]
  {
    !SUBTYPE[Black] {}
    !SUBTYPE[BlackFlat] {}
  }
}
