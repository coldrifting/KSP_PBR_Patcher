@PART[nflv-cluster-mount-upper-5-2]:AFTER[NearFutureLaunchVehicles]
{
  @MODEL,*:HAS[#model[NearFutureLaunchVehicles/Parts/Structural/Mounting/nflv-cluster-mount-upper-5-2]]
  {
    %model = NearFutureLaunchVehiclesPBR/Assets/Structural/nflv-cluster-mount-upper-5-2
  }

  // Typo in original config
  !MODULE[ModuleB9PartSwitch]:HAS[#moduleID[shroudLength]],-1 {}

  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = VulkanMountBase
      transform = VulkanMount8x
      transform = VulkanMount4x
      transform = VulkanMount2x
      transform = VulkanMount0x
    }

    COLORZONE
    {
      name = mli
      swatchPrimary = mliGold
      swatchSecondary = blank
      transform = VulkanMountBaseFoil
    }

    COLORZONE
    {
      name = shrouds
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = InterstageLong
      transform = InterstageMedLong
      transform = InterstageMed
      transform = InterstageMedShort
    }
  }
}
