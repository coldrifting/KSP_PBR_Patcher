@PART[nflv-cluster-mount-upper-5-3]:AFTER[NearFutureLaunchVehicles]
{
  @MODEL,*:HAS[#model[NearFutureLaunchVehicles/Parts/Structural/Mounting/nflv-cluster-mount-upper-5-3]]
  {
    %model = NearFutureLaunchVehiclesPBR/Assets/Structural/nflv-cluster-mount-upper-5-3
  }

  !MODULE[ModuleB9PartSwitch],*:HAS[#moduleID[shroudColor]] {}

  MODULE
  {
    name = ModuleTechnicolor

    COLORZONE
    {
      name = main
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = S2Size2
      transform = S-II7x
      transform = S-II5x
      transform = S-II4x
      transform = S-II3x
      transform = S-II1x
      transform = 5mStrucutralButt003
    }

    COLORZONE
    {
      name = shrouds
      swatchPrimary = porkjetWhite
      swatchSecondary = porkjetBlack
      transform = InterstageLong
      transform = InterstageMedLong
      transform = InterstageMed
      transform = InterstageMedShort
    }
  }
}
