//// Patches
@PART[roverWheel3]
{
  !MODEL,* {}
  MODEL
  {
    model = ReStockPBR_Patch/Assets/Ground/roverWheel3
  }

  SHABBY_MATERIAL_REPLACE
  {
      materialDef = restock-pbr-wheels-1
      targetMaterial = roverWheel3
  }

  !MODULE[FXModuleLookAtConstraint],* {}
  MODULE
  {
    name = FXModuleLookAtConstraint

    CONSTRAINLOOKFX
    {
      targetName = Arm0A
      rotatorsName = Arm0B
    }
