    {
      targetName = Arm0B
      rotatorsName = Arm0A
    }
    CONSTRAINLOOKFX
    {
      targetName = Arm1A
      rotatorsName = Arm1B
    }
    CONSTRAINLOOKFX
    {
      targetName = Arm1B
      rotatorsName = Arm1A
    }
    CONSTRAINLOOKFX
    {
      targetName = Arm2A
      rotatorsName = Arm2B
    }
    CONSTRAINLOOKFX
    {
      targetName = Arm2B
      rotatorsName = Arm2A
    }
  }

  MODULE
  {
    name = ModuleTechnicolor
    
    COLORZONE
    {
      name = main
