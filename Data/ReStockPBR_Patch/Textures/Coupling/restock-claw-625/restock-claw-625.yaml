size: [512, 512]

color_primary:
- fill:
    image: ReStock/Assets/Coupling/restock-claw-625.dds
    channels: rgb
    mask: color_primary

- curves:
    points: [ [15, 64], [128, 255] ]
    mask: color_primary

- fill:
    color: black
    mask: color_primary
    invert_masks: True

color_secondary:
- fill:
    image: ReStock/Assets/Coupling/restock-claw-625.dds
    channels: rgb
    mask: color_secondary

- curves:
    points: [ [45, 192], [90, 240] ]
    mask: color_secondary

diffuse:
- fill:
    image: ReStock/Assets/Coupling/restock-claw-625.dds
    channels: rgb

- saturation:
    percent: 0
    mask: wires
    invert_masks: True

- saturation:
    percent: 120
    mask: wires

- curves:
    points: [ [64, 100] ]
    mask: color_primary
    invert_masks: True

- curves:
    points: [ [0, 180] ]
    mask: color_primary

gloss:
- fill:
    image: ReStock/Assets/Coupling/restock-claw-625.dds
    channels: a

- curves:
    points: [ [40, 128], [128, 225] ]
    masks: 
    - metal_bright
    - color_primary
    invert_masks: True

- curves:
    points: [ [64, 100] ]
    mask: metal_bright

- curves:
    points: [ [32, 128], [100, 225] ]
    mask: color_primary

gloss_alt:
- copy:
     group: gloss

- brightness:
    percent: 50
    masks:
    - color_primary
    - color_secondary

metal:
- fill:
    color: white

- fill:
    color: black
    mask: wires


metal_alt:
- copy:
    group: metal

- fill:
    color: black
    masks:
    - color_primary
    - color_secondary
