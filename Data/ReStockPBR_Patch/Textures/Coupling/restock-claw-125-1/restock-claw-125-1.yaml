size: [1024, 512]

color_primary:
- fill:
    color: black

color_secondary:
- fill:
    image: ReStock/Assets/Coupling/restock-claw-125-1.dds
    channels: rgb
    mask: color_secondary

- invert:
    mask: color_secondary

- curves:
    points: [ [0, 64], [160, 255] ]
    mask: color_secondary

diffuse:
- fill:
    image: ReStock/Assets/Coupling/restock-claw-125-1.dds
    channels: rgb

- saturation:
    percent: 0
    masks: 
    - lens
    - wires
    - warning
    invert_masks: True

- saturation:
    percent: 120
    masks: 
    - lens
    - wires
    - warning

- curves:
    points: [ [64, 136] ]
    mask: color_secondary
    invert_masks: True

- curves:
    points: [ [64, 100] ]
    mask: color_secondary

gloss:
- fill:
    image: ReStock/Assets/Coupling/restock-claw-125-1.dds
    channels: a

- curves:
    points: [ [32, 128], [110, 230] ]

gloss_alt:
- copy:
     group: gloss

- brightness:
    percent: 50
    mask: color_secondary

metal:
- fill:
    color: white

metal_alt:
- copy:
    group: metal

- fill:
    color: black
    mask: color_secondary
