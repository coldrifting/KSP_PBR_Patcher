size: [2048, 2048]

color_primary:
- fill:
    image: ReStock/Assets/Resource/restock-isru-1.dds
    channels: a

- saturation:
    percent: 0

- curves:
    points: [ [16, 128], [35, 192], [75, 225] ]
    mask: metal_darkest

- curves:
    points: [ [16, 64], [100, 200] ]
    mask: metal_dark

- curves:
    points: [ [64, 100] ]
    mask: metal_light

- curves:
    points: [ [64, 115] ]
    mask: metal_1

- curves:
    points: [ [64, 165], [128, 225] ]
    mask: metal_2

- curves:
    points: [ [64, 100] ]
    mask: metal_3

- fill:
    color: "#EEEEEE"
    mask: metal
    invert_masks: True

- curves:
    points: [ [90, 0], [150, 255]]

- fill:
    color: black
    mask: color_primary
    invert_masks: True

color_secondary:
- fill:
    image: ReStock/Assets/Resource/restock-isru-1.dds
    channels: a

- saturation:
    percent: 0

- curves:
    points: [ [16, 128], [35, 192], [75, 225] ]
    mask: metal_darkest

- curves:
    points: [ [16, 64], [100, 200] ]
    mask: metal_dark

- curves:
    points: [ [64, 100] ]
    mask: metal_light

- curves:
    points: [ [64, 115] ]
    mask: metal_1

- curves:
    points: [ [64, 165], [128, 225] ]
    mask: metal_2

- curves:
    points: [ [64, 100] ]
    mask: metal_3

- fill:
    color: "#EEEEEE"
    mask: metal
    invert_masks: True

- curves:
    points: [ [128, 0], [192, 255]]

- fill:
    color: black
    mask: color_secondary
    invert_masks: True

diffuse:
- fill:
    image: ReStock/Assets/Resource/restock-isru-1.dds
    channels: rgb

- saturation:
    percent: 0
    mask: metal

- saturation:
    percent: 120
    mask: metal
    invert_masks: True

- curves:
    points: [ [64, 100] ]

- curves:
    points: [ [64, 100] ]
    mask: metal_4

gloss:
- fill:
    image: ReStock/Assets/Resource/restock-isru-1.dds
    channels: a

- saturation:
    percent: 0

- curves:
    points: [ [16, 128], [35, 192], [75, 225] ]
    mask: metal_darkest

- curves:
    points: [ [16, 64], [100, 200] ]
    mask: metal_dark

- curves:
    points: [ [64, 100] ]
    mask: metal_light

- curves:
    points: [ [64, 115] ]
    mask: metal_1

- curves:
    points: [ [64, 165], [128, 225] ]
    mask: metal_2

- curves:
    points: [ [64, 100] ]
    mask: metal_3

- fill:
    color: "#EEEEEE"
    mask: metal
    invert_masks: True

gloss_alt:
- copy:
     group: gloss

- brightness:
    percent: 50
    masks:
    - color_primary
    - color_secondary

metal:
- fill:
    color: white
    mask: metal

metal_alt:
- copy:
    group: metal

- fill:
    color: black
    masks:
    - color_primary
    - color_secondary
