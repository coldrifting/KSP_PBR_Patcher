size: [512, 512]

color_primary:
- fill:
    image: SquadExpansion/Serenity/Parts/Aero/Assets/shroudsDiffuse_plain.dds
    channels: rgb

- saturation:
    percent: 0

- curves:
    points: [ [128, 255] ]
    mask: color_primary

- fill:
    color: black
    mask: color_primary
    invert_masks: True

color_secondary:
- fill:
    image: SquadExpansion/Serenity/Parts/Aero/Assets/shroudsDiffuse_plain.dds
    channels: rgb

- saturation:
    percent: 0

- curves:
    points: [ [128, 255] ]
    mask: color_secondary

- fill:
    color: black
    mask: color_secondary
    invert_masks: True

diffuse:
- fill:
    image: SquadExpansion/Serenity/Parts/Aero/Assets/shroudsDiffuse_plain.dds
    channels: rgb

- saturation:
    percent: 0

- curves:
    points: [ [64, 110] ]
    mask: metal_inside

- curves:
    points: [ [22, 64] ]
    mask: metal_trim

gloss:
- fill:
    image: SquadExpansion/Serenity/Parts/Aero/Assets/shroudsDiffuse_plain.dds
    channels: rgb

- saturation:
    percent: 0

- curves:
    points: [ [32, 64] ]
    mask: color_primary

- curves:
    points: [ [64, 160] ]
    mask: metal_inside

- curves:
    points: [ [12, 64], [100, 255] ]
    mask: metal_trim

gloss_alt:
- copy:
     group: gloss

- brightness:
    percent: 50
    masks: 
    - color_primary

metal:
- fill:
    color: white

metal_alt:
- copy:
    group: metal

- fill:
    color: black
    mask: color_primary
